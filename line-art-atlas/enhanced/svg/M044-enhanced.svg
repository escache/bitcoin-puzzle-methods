<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>M044 — D1 high-index ratio bands / enhanced thematic plate</title><desc>Estimate normalized D1 positions from solved examples and prioritize a common ratio band for new slots. Original finding: Calibrated narrow bands reduce width conditionally but miss held-out keys; their complement is required for complete support.</desc><rect width="1200" height="1500" fill="white"/><defs><clipPath id="focus-M044"><rect x="61" y="821" width="423" height="280"/></clipPath></defs><path d="M48 38 L1152 38" fill="none" stroke="#151515" stroke-width="3"/><text x="49" y="70" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">03  /  VOLUMES / DECOMPOSITION</text><g transform="translate(1050 55) scale(.88)"><rect x="18" y="31" width="51" height="51" fill="#ededed" stroke="#151515" stroke-width="1.5"/><path d="M18 31 L41 14 H92 L69 31 M69 31 L92 14 V65 L69 82" fill="none" stroke="#151515" stroke-width="1.2"/><path d="M35,31 L35,82" fill="none" stroke="#c5c5c5" stroke-width="0.55"/><path d="M52,31 L52,82" fill="none" stroke="#c5c5c5" stroke-width="0.55"/></g><text x="49" y="109" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#151515">M044</text><text x="49" y="151" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" text-anchor="start" fill="#333333">D1 high-index ratio bands</text><g transform="translate(48 214) scale(2.3)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:path d="M35,96 L445,96" fill="none" stroke="#151515" stroke-width="1.5" /><ns0:path d="M35,83 L35,109" fill="none" stroke="#151515" stroke-width="2" /><ns0:path d="M445,83 L445,109" fill="none" stroke="#151515" stroke-width="2" /><ns0:rect x="175" y="68" width="104" height="56" fill="#ededed" stroke="none" stroke-width="1" /><ns0:path d="M175,96 L279,96" fill="none" stroke="#151515" stroke-width="4" /><ns0:path d="M175,62 L175,130" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M279,62 L279,130" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:text x="227" y="151" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">selected band</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">normalized D1</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">calibration band</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">prioritized values</ns0:text></ns0:g></g><rect x="466.6" y="326.7" width="266.8" height="227.7" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="7 7"/><text x="457.6" y="316.7" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">D</text><text x="232" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">01</text><text x="600" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">02</text><text x="968" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">03</text><path d="M48 757 L1152 757" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">D / OPERATION DETAIL</text><rect x="60" y="820" width="425" height="282" fill="white" stroke="#777777" stroke-width="1"/><g clip-path="url(#focus-M044)"><g transform="translate(-352.955 704.303) scale(2.60606)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:path d="M35,96 L445,96" fill="none" stroke="#151515" stroke-width="1.5" /><ns0:path d="M35,83 L35,109" fill="none" stroke="#151515" stroke-width="2" /><ns0:path d="M445,83 L445,109" fill="none" stroke="#151515" stroke-width="2" /><ns0:rect x="175" y="68" width="104" height="56" fill="#ededed" stroke="none" stroke-width="1" /><ns0:path d="M175,96 L279,96" fill="none" stroke="#151515" stroke-width="4" /><ns0:path d="M175,62 L175,130" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M279,62 L279,130" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:text x="227" y="151" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">selected band</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">normalized D1</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">calibration band</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">prioritized values</ns0:text></ns0:g></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.13× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">Estimate normalized D1 positions from solved examples</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">and prioritize a common ratio band for new slots.</text><text x="550" y="917.7" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="946.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="946.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">normalized D1</text><text x="550" y="976.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="976.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">calibration band</text><text x="550" y="1006.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1006.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">prioritized values</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Historical high-index min/max or leave-one-out bands were exported as search presets. Their reduced</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">width is real for the chosen band, but held-out misses show it is not guaranteed containment.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / EXECUTED RECORD</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Calibrated narrow bands reduce width conditionally but miss held-out keys; their complement is required</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">for complete support.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S135</text></svg>