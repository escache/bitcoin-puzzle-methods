"#c5c5c5" stroke="#151515" stroke-width="0" /><ns0:circle cx="397" cy="55" r="3" fill="#c5c5c5" stroke="#151515" stroke-width="0" /><ns0:circle cx="429" cy="55" r="3" fill="#c5c5c5" stroke="#151515" stroke-width="0" /><ns0:circle cx="45" cy="113" r="3" fill="#c5c5c5" stroke="#151515" stroke-width="0" /><ns0:circle cx="77" cy="113" r="3" fill="#c5c5c5" stroke="#151515" stroke-width="0" /><ns0:circle cx="109" cy="113" r="3" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="141" cy="113" r="3" fill="#c5c5c5" stroke="#151515" stroke-width="0" /><ns0:circle cx="173" cy="113" r="3" fill="#c5c5c5" stroke="#151515" stroke-width="0" /><ns0:circle cx="205" cy="113" r="3" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="237" cy="113" r="3" fill="#c5c5c5" stroke="#151515" stroke-width="0" /><ns0:circle cx="269" cy="113" r="3" fill="#c5c5c5" stroke="#151515" stroke-width="0" /><ns0:circle cx="301" cy="113" r="3" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="333" cy="113" r="3" fill="#c5c5c5" stroke="#151515" stroke-width="0" /><ns0:circle cx="365" cy="113" r="3" fill="#c5c5c5" stroke="#151515" stroke-width="0" /><ns0:circle cx="397" cy="113" r="3" fill="#c5c5c5" stroke="#151515" stroke-width="0" /><ns0:circle cx="429" cy="113" r="3" fill="#c5c5c5" stroke="#151515" stroke-width="0" /><ns0:path d="M109,55 L301,55" fill="none" stroke="#151515" stroke-width="2" /><ns0:path d="M109 73 V87 H205 V73 M205 73 V87 H301 V73" fill="none" stroke="#151515" stroke-width="0.9" /><ns0:text x="205" y="159" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#777777" text-anchor="middle" font-weight="normal">equal gaps / selected labels</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">subsets</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">double progressions</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">declared Ramsey tests</ns0:text></ns0:g></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.14× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">Ramsey search recursively extends combinatorial</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">objects while rejecting forbidden structures; a faithful</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">interpreter must implement the specified objects and</text><text x="550" y="920.05" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">filter semantics.</text><text x="550" y="974.4" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="1003.4" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="1003.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">subsets</text><text x="550" y="1033.4" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1033.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">double progressions</text><text x="550" y="1063.4" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1063.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">declared Ramsey tests</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">The historical class lacks a real parser and uses an unrelated parity placeholder for double APs. Its general</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">k-AP detector can accept an incomplete progression; later versions repair only some defects.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / AUDITED/CORRECTED</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Historical code uses placeholders and incomplete language semantics; original filter claims do not</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">establish a cryptographic advantage.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S002, S022</text></svg>