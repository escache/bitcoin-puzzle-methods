uation check</ns0:text></ns0:g></g><rect x="524.1" y="329" width="190.9" height="161" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="7 7"/><text x="515.1" y="319" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">D</text><text x="232" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">01</text><text x="600" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">02</text><text x="968" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">03</text><path d="M48 757 L1152 757" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">D / OPERATION DETAIL</text><rect x="60" y="820" width="425" height="282" fill="white" stroke="#777777" stroke-width="1"/><g clip-path="url(#focus-M131)"><g transform="translate(-643.4 647.714) scale(3.68571)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:rect x="47" y="28" width="92" height="34" fill="white" stroke="#151515" stroke-width="1.2" /><ns0:text x="93" y="49" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">r, s</ns0:text><ns0:rect x="47" y="105" width="92" height="34" fill="white" stroke="#151515" stroke-width="1.2" /><ns0:text x="93" y="126" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">key relation</ns0:text><ns0:circle cx="240" cy="83" r="21" fill="#ededed" stroke="#151515" stroke-width="1.7" /><ns0:text x="240" y="87" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">nonce</ns0:text><ns0:path d="M145,45 L219,76" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:path d="M145,122 L219,91" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:path d="M269,83 L349,83" fill="none" stroke="#151515" stroke-width="2.2" /><ns0:path d="M349,83 L342.857,86.356" fill="none" stroke="#151515" stroke-width="2.2" /><ns0:path d="M349,83 L342.857,79.644" fill="none" stroke="#151515" stroke-width="2.2" /><ns0:rect x="364" y="63" width="55" height="40" fill="white" stroke="#151515" stroke-width="1.2" /><ns0:text x="392" y="88" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">test</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">Block-1 signature</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">manual nonce hypothesis</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">binding equation check</ns0:text></ns0:g></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.60× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">ECDSA gives s*w=z+r*d modulo the group order when</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">the signing nonce is chosen as the Block-1 scalar w.</text><text x="550" y="917.7" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="946.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="946.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Block-1 signature</text><text x="550" y="976.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="976.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">manual nonce hypothesis</text><text x="550" y="1006.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1006.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">binding equation check</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">The code verifies the signature and derives w=A+B*d. Substituting that relation back into the same</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">signature adds no independent equation; one unknown scalar remains behind public-point multiplication.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / EXECUTED RECORD</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">One signature gives an affine relation between two scalar names but leaves an ECDLP-equivalent</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">unknown.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S132</text></svg>