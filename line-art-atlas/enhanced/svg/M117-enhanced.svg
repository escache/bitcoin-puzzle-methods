troke-width="0.7" /><ns0:rect x="150" y="67" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="172" y="67" width="19" height="15" fill="#151515" stroke="#777777" stroke-width="0.7" /><ns0:rect x="194" y="67" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="216" y="67" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="238" y="67" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="260" y="67" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="282" y="67" width="19" height="15" fill="#151515" stroke="#777777" stroke-width="0.7" /><ns0:rect x="304" y="67" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="326" y="67" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="348" y="67" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="370" y="67" width="19" height="15" fill="#151515" stroke="#777777" stroke-width="0.7" /><ns0:rect x="392" y="67" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="62" y="104" width="19" height="15" fill="#151515" stroke="#777777" stroke-width="0.7" /><ns0:rect x="84" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="106" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="128" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="150" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="172" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="194" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="216" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-