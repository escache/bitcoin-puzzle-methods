rif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">funding inputs</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">0.99-BTC outputs</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">neighboring cluster</ns0:text></ns0:g><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M150.96,85 L145.845,88.1361" fill="none" stroke="#151515" stroke-width="0.85" /><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M150.96,85 L145.845,81.8639" fill="none" stroke="#151515" stroke-width="0.85" /><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M190,47.6 L193.136,52.7151" fill="none" stroke="#151515" stroke-width="0.85" /><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M190,47.6 L186.864,52.7151" fill="none" stroke="#151515" stroke-width="0.85" /><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M190,125.12 L186.864,120.005" fill="none" stroke="#151515" stroke-width="0.85" /><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M190,125.12 L193.136,120.005" fill="none" stroke="#151515" stroke-width="0.85" /><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M278.4,53.72 L274.624,58.3828" fill="none" stroke="#151515" stroke-width="0.85" /><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M278.4,53.72 L272.532,52.4698" fill="none" stroke="#151515" stroke-width="0.85" /><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M278.4,113.56 L272.568,114.972" fill="none" stroke="#151515" stroke-width="0.85" /><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M278.4,113.56 L274.497,109.003" fill="none" stroke="#151515" stroke-width="0.85" /><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M396.16,69.6 L390.244,70.603" fill="none" stroke="#151515" stroke-width="0.85" /><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M396.16,69.6 L392.583,64.783" fill="none" stroke="#151515" stroke-width="0.85" /></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.30× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">Detect transactions with repeated 0.99-BTC outputs and</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">traverse their funding/fanout neighbors.</text><text x="550" y="917.7" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="946.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="946.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">funding inputs</text><text x="550" y="976.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="976.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">0.99-BTC outputs</text><text x="550" y="1006.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1006.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">neighboring cluster</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">The crawler uses explicit output-count/value thresholds and bounded BFS expansion. This identifies a</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">transaction pattern or cluster, not an algebraic relation among its private keys.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / EXECUTED RECORD</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Breadth-first funding/output graph searches and message scans are archived.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S142, S140</text></svg>