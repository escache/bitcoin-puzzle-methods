nt-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">multiply + increment</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">modular next state</ns0:text></ns0:g><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="100" y="145" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#777777" text-anchor="middle" font-weight="normal">seeded state</ns0:text></g><rect x="583.9" y="331.3" width="211.6" height="181.7" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="7 7"/><text x="574.9" y="321.3" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">D</text><text x="232" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">01</text><text x="600" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">02</text><text x="968" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">03</text><path d="M48 757 L1152 757" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">D / OPERATION DETAIL</text><rect x="60" y="820" width="425" height="282" fill="white" stroke="#777777" stroke-width="1"/><g clip-path="url(#focus-M087)"><g transform="translate(-638.665 665.443) scale(3.26582)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:rect x="58" y="66" width="86" height="59" fill="#ededed" stroke="#151515" stroke-width="1.7" /><ns0:rect x="235" y="66" width="86" height="59" fill="white" stroke="#151515" stroke-width="1.7" /><ns0:text x="101" y="101" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#151515" text-anchor="middle" font-weight="normal">state</ns0:text><ns0:text x="278" y="101" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#151515" text-anchor="middle" font-weight="normal">a*x + c</ns0:text><ns0:path d="M154,95 L222,95" fill="none" stroke="#151515" stroke-width="2" /><ns0:path d="M222,95 L215.857,98.356" fill="none" stroke="#151515" stroke-width="2" /><ns0:path d="M222,95 L215.857,91.644" fill="none" stroke="#151515" stroke-width="2" /><ns0:path d="M278 57 V27 H101 V57" fill="none" stroke="#777777" stroke-width="1.1" /><ns0:path d="M329,95 L407,95" fill="none" stroke="#151515" stroke-width="1.6" /><ns0:path d="M407,95 L400.857,98.356" fill="none" stroke="#151515" stroke-width="1.6" /><ns0:path d="M407,95 L400.857,91.644" fill="none" stroke="#151515" stroke-width="1.6" /><ns0:rect x="373" y="140" width="9" height="15" fill="#151515" stroke="#777777" stroke-width="0.7" /><ns0:rect x="385" y="140" width="9" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="397" y="140" width="9" height="15" fill="#151515" stroke="#777777" stroke-width="0.7" /><ns0:rect x="409" y="140" width="9" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="421" y="140" width="9" height="15" fill="#151515" stroke="#777777" stroke-width="0.7" /><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">state x</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">multiply + increment</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">modular next state</ns0:text></ns0:g><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="100" y="145" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#777777" text-anchor="middle" font-weight="normal">seeded state</ns0:text></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.42× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">A fixed affine recurrence maps the same low-bit input to</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">the same output. Contradictory observed transitions can</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">therefore reject that recurrence family.</text><text x="550" y="946.05" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">state x</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">multiply + increment</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">modular next state</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">The audit exhausts small modular coefficient pairs and gives an exact parity obstruction. It does not</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">exclude hidden state, changing coefficients, discarded outputs or unrelated deterministic wallets.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / EXECUTED RECORD</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Exact low-bit constraints reject the named fixed-parameter recurrence family; hidden state and different</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">generators remain outside scope.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S053, S064</text></svg>