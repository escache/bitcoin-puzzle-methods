<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>M018 — Synthetic fixtures versus disclosed puzzle data / enhanced thematic plate</title><desc>A synthetic fixture can validate pipeline logic because its generation rule is known. It must remain separate from actual published puzzle secrets. Original finding: PEC37 stores synthetic 1-160 chains separately and compares them with actual disclosed keys. Synthetic keys are not puzzle recoveries.</desc><rect width="1200" height="1500" fill="white"/><defs><clipPath id="focus-M018"><rect x="61" y="821" width="423" height="280"/></clipPath></defs><path d="M48 38 L1152 38" fill="none" stroke="#151515" stroke-width="3"/><text x="49" y="70" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">01  /  COVERAGE / VERIFICATION</text><g transform="translate(1050 55) scale(.88)"><path d="M8,48 L94,48" fill="none" stroke="#151515" stroke-width="2"/><path d="M10,22 L10,62" fill="none" stroke="#151515" stroke-width="1"/><path d="M20,34 L20,62" fill="none" stroke="#151515" stroke-width="1"/><path d="M30,22 L30,62" fill="none" stroke="#151515" stroke-width="1"/><path d="M40,34 L40,62" fill="none" stroke="#151515" stroke-width="1"/><path d="M50,22 L50,62" fill="none" stroke="#151515" stroke-width="1"/><path d="M60,34 L60,62" fill="none" stroke="#151515" stroke-width="1"/><path d="M70,22 L70,62" fill="none" stroke="#151515" stroke-width="1"/><path d="M80,34 L80,62" fill="none" stroke="#151515" stroke-width="1"/><path d="M90,22 L90,62" fill="none" stroke="#151515" stroke-width="1"/></g><text x="49" y="109" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#151515">M018</text><text x="49" y="151" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" text-anchor="start" fill="#333333">Synthetic fixtures versus disclosed puzzle data</text><g transform="translate(48 214) scale(2.3