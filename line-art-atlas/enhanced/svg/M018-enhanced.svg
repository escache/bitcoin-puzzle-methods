Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">02</text><text x="968" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">03</text><path d="M48 757 L1152 757" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">D / OPERATION DETAIL</text><rect x="60" y="820" width="425" height="282" fill="white" stroke="#777777" stroke-width="1"/><g clip-path="url(#focus-M018)"><g transform="translate(-369.92 746.86) scale(2.58)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:path d="M45,55 L433,55" fill="none" stroke="#c5c5c5" stroke-width="0.8" /><ns0:circle cx="53" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="92" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="131" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="170" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="209" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="248" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="287" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="326" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="365" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="404" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:path d="M45,123 L433,123" fill="none" stroke="#c5c5c5" stroke-width="0.8" /><ns0:circle cx="53" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0" /><ns0:circle cx="92" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0" /><ns0:circle cx="131" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0" /><ns0:circle cx="170" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0" /><ns0:circle cx="209" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0" /><ns0:circle cx="248" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0" /><ns0:circle cx="287" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0" /><ns0:circle cx="326" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0" /><ns0:circle cx="365" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0" /><ns0:circle cx="404" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0" /><ns0:circle cx="248" cy="55" r="9" fill="white" stroke="#151515" stroke-width="1.8" /><ns0:path d="M248,70 L248,105" fill="none" stroke="#151515" stroke-width="1.5" /><ns0:path d="M248,105 L244.644,98.8569" fill="none" stroke="#151515" stroke-width="1.5" /><ns0:path d="M248,105 L251.356,98.8569" fill="none" stroke="#151515" stroke-width="1.5" /><ns0:text x="248" y="158" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">hidden until scoring</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">synthetic fixture</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">separate real corpus</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">validate pipeline</ns0:text></ns0:g><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M53 23 V16 H209 V23" fill="none" stroke="#777777" stroke-width="0.75" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="131" y="11" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#777777" text-anchor="middle" font-weight="normal">fit on retained examples</ns0:text></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.12× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">A synthetic fixture can validate pipeline logic because</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">its generation rule is known. It must remain separate</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">from actual published puzzle secrets.</text><text x="550" y="946.05" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">synthetic fixture</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">separate real corpus</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">validate pipeline</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">PEC37 tools generate synthetic chains and compare them with disclosed puzzle data. Successful synthetic</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">reconstruction tests the fixture rule; it cannot populate undisclosed puzzle-key rows.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / EXECUTED RECORD</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">PEC37 stores synthetic 1-160 chains separately and compares them with actual disclosed keys. Synthetic</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">keys are not puzzle recoveries.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S224, S223</text></svg>