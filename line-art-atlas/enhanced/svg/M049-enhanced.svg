<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>M049 — Constraint-satisfaction slot construction / enhanced thematic plate</title><desc>Express digit domains and interval inequalities as constraints, then select variable orderings to prune impossible partial assignments. Original finding: Exact feasibility graph with fixed, MRV and degree orderings; pruning invalid tuples does not predict the valid target tuple.</desc><rect width="1200" height="1500" fill="white"/><defs><clipPath id="focus-M049"><rect x="61" y="821" width="423" height="280"/></clipPath></defs><path d="M48 38 L1152 38" fill="none" stroke="#151515" stroke-width="3"/><text x="49" y="70" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">03  /  VOLUMES / DECOMPOSITION</text><g transform="translate(1050 55) scale(.88)"><rect x="18" y="31" width="51" height="51" fill="#ededed" stroke="#151515" stroke-width="1.5"/><path d="M18 31 L41 14 H92 L69 31 M69 31 L92 14 V65 L69 82" fill="none" stroke="#151515" stroke-width="1.2"/><path d="M35,31 L35,82" fill="none" stroke="#c5c5c5" stroke-width="0.55"/><path d="M52,31 L52,82" fill="none" stroke="#c5c5c5" stroke-width="0.55"/></g><text x="49" y="109" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#151515">M049</text><text x="49" y="151" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" text-anchor="start" fill="#333333">Constraint-satisfaction slot construction</text><g transform="translate(48 214) scale(2.3)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:path d="M240,22 L118,72" fill="none" stroke="#151515" stroke-width="1.7" /><ns0:path d="M240,22 L357,72" fill="none" stroke="#151515" stroke-width="1.7" /><ns0:path d="M118,72 L55,132" fill="none" str