<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>M123 — Cantor-to-keyspace homeomorphism claim / enhanced thematic plate</title><desc>A homeomorphism must be a continuous bijection with a continuous inverse. An infinite Cantor set cannot be bijective with a finite integer keyspace. Original finding: Rounding real samples to finite keys is not a homeomorphism from an infinite Cantor set.</desc><rect width="1200" height="1500" fill="white"/><defs><clipPath id="focus-M123"><rect x="61" y="821" width="423" height="280"/></clipPath></defs><path d="M48 38 L1152 38" fill="none" stroke="#151515" stroke-width="3"/><text x="49" y="70" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">08  /  SETS / TOPOLOGY</text><g transform="translate(1050 55) scale(.88)"><path d="M7,17 L94,17" fill="none" stroke="#151515" stroke-width="4"/><path d="M7,38 L36,38" fill="none" stroke="#151515" stroke-width="3"/><path d="M65,38 L94,38" fill="none" stroke="#151515" stroke-width="3"/><path d="M7,59 L16.6667,59" fill="none" stroke="#151515" stroke-width="3"/><path d="M65,59 L74.6667,59" fill="none" stroke="#151515" stroke-width="3"/><path d="M26.3333,59 L36,59" fill="none" stroke="#151515" stroke-width="3"/><path d="M84.3333,59 L94,59" fill="none" stroke="#151515" stroke-width="3"/><path d="M7,80 L10.2222,80" fill="none" stroke="#151515" stroke-width="3"/><path d="M65,80 L68.2222,80" fill="none" stroke="#151515" stroke-width="3"/><path d="M26.3333,80 L29.5556,80" fill="none" stroke="#151515" stroke-width="3"/><path d="M84.3333,80 L87.5556,80" fill="none" stroke="#151515" stroke-width="3"/><path d="M13.4444,80 L16.6667,80" fill="none" stroke="#151515" stroke-width="3"/><path d="M71.4444,80 L74.6667,80" fill="none" stroke="#151515" stroke-width="3"/><path d="M32.7778,80 L36,80" fill="none" stroke="#151515" stroke-width="3"/><path d="M90.7778,80 L94,80" fill="none" stroke="#151515" stroke-width="3"/></g><text x="49" y="109" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#151515">M123</text><text x="49" y="151" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" text-anchor="start" fill="#333333">Cantor-to-keyspace homeomorphism claim</text><g transform="translate(48 214) scale(2.3)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:path d="M40,31 L440,31" fill="none" stroke="#151515" stroke-width="5" /><ns0:path d="M40,67 L173.333,67" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M306.667,67 L440,67" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M40,103 L84.4444,103" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M306.667,103 L351.111,103" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M128.889,103 L173.333,103" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M395.556,103 L440,103" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M40,139 L54.8148,139" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M306.667,139 L321.481,139" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M128.889,139 L143.704,139" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M395.556,139 L410.37,139" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M69.6296,139 L84.4444,139" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M336.296,139 L351.111,139" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M158.519,139 L173.333,139" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M425.185,139 L440,139" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:text x="240" y="165" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#777777" text-anchor="middle" font-weight="normal">proposed mapping ?</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">Cantor-like encoding</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">proposed correspondence</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">finite keyspace</ns0:text></ns0:g><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="240" y="53" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#777777" text-anchor="middle" font-weight="normal">middle thirds</ns0:text></g><rect x="128.5" y="349.7" width="315.1" height="220.8" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="7 7"/><text x="119.5" y="339.7" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">D</text><text x="232" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">01</text><text x="600" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">02</text><text x="968" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">03</text><path d="M48 757 L1152 757" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">D / OPERATION DETAIL</text><rect x="60" y="820" width="425" height="282" fill="white" stroke="#777777" stroke-width="1"/><g clip-path="url(#focus-M123)"><g transform="translate(-5.65625 673.438) scale(2.6875)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:path d="M40,31 L440,31" fill="none" stroke="#151515" stroke-width="5" /><ns0:path d="M40,67 L173.333,67" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M306.667,67 L440,67" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M40,103 L84.4444,103" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M306.667,103 L351.111,103" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M128.889,103 L173.333,103" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M395.556,103 L440,103" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M40,139 L54.8148,139" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M306.667,139 L321.481,139" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M128.889,139 L143.704,139" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M395.556,139 L410.37,139" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M69.6296,139 L84.4444,139" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M336.296,139 L351.111,139" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M158.519,139 L173.333,139" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:path d="M425.185,139 L440,139" fill="none" stroke="#151515" stroke-width="3.2" /><ns0:text x="240" y="165" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#777777" text-anchor="middle" font-weight="normal">proposed mapping ?</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">Cantor-like encoding</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">proposed correspondence</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">finite keyspace</ns0:text></ns0:g><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="240" y="53" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#777777" text-anchor="middle" font-weight="normal">middle thirds</ns0:text></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.17× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">A homeomorphism must be a continuous bijection with</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">a continuous inverse. An infinite Cantor set cannot be</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">bijective with a finite integer keyspace.</text><text x="550" y="946.05" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Cantor-like encoding</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">proposed correspondence</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">finite keyspace</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">The earlier function merely scales floating coordinates into sample min/max bounds and rounds to</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">integers. It is a lossy candidate map, not the source paper&#x27;s homeomorphism construction.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / AUDITED/CORRECTED</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Rounding real samples to finite keys is not a homeomorphism from an infinite Cantor set.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S022, S003</text></svg>