<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>M017 — 32-byte padding and dual-format P2PKH checks / enhanced thematic plate</title><desc>A scalar is encoded as exactly 32 big-endian bytes, multiplied by G, serialized and hashed. P2PKH comparisons use the address&#x27;s decoded 20-byte hash. Original finding: Left-padded scalar inputs, compressed/uncompressed public keys and known scalar-one address vectors guard verifier correctness.</desc><rect width="1200" height="1500" fill="white"/><defs><clipPath id="focus-M017"><rect x="61" y="821" width="423" height="280"/></clipPath></defs><path d="M48 38 L1152 38" fill="none" stroke="#151515" stroke-width="3"/><text x="49" y="70" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">01  /  COVERAGE / VERIFICATION</text><g transform="translate(1050 55) scale(.88)"><path d="M8,48 L94,48" fill="none" stroke="#151515" stroke-width="2"/><path d="M10,22 L10,62" fill="none" stroke="#151515" stroke-width="1"/><path d="M20,34 L20,62" fill="none" stroke="#151515" stroke-width="1"/><path d="M30,22 L30,62" fill="none" stroke="#151515" stroke-width="1"/><path d="M40,34 L40,62" fill="none" stroke="#151515" stroke-width="1"/><path d="M50,22 L50,62" fill="none" stroke="#151515" stroke-width="1"/><path d="M60,34 L60,62" fill="none" stroke="#151515" stroke-width="1"/><path d="M70,22 L70,62" fill="none" stroke="#151515" stroke-width="1"/><path d="M80,34 L80,62" fill="none" stroke="#151515" stroke-width="1"/><path d="M90,22 L90,62" fill="none" stroke="#151515" stroke-width="1"/></g><text x="49" y="109" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#151515">M017</text><text x="49" y="151" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" text-anchor="start" fill="#333333">32-byte padding and dual-format P2PKH checks</text><g transform="translate(48 214) scale(2.3)"><ns