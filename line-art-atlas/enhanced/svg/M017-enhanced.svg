="#151515" text-anchor="middle" font-weight="normal">B</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">32-byte scalar</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">public-key encodings</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">20-byte hash</ns0:text></ns0:g></g><rect x="521.8" y="345.1" width="193.2" height="186.3" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="7 7"/><text x="512.8" y="335.1" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">D</text><text x="232" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">01</text><text x="600" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">02</text><text x="968" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">03</text><path d="M48 757 L1152 757" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">D / OPERATION DETAIL</text><rect x="60" y="820" width="425" height="282" fill="white" stroke="#777777" stroke-width="1"/><g clip-path="url(#focus-M017)"><g transform="translate(-517.426 650.444) scale(3.18519)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:rect x="40" y="75" width="58" height="42" fill="#ededed" stroke="#151515" stroke-width="1.8" /><ns0:path d="M100,96 L172,96" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M172,96 L234,54" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:path d="M234,54 L230.796,60.2238" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:path d="M234,54 L227.032,54.6669" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:rect x="245" y="38" width="82" height="32" fill="white" stroke="#151515" stroke-width="1.3" /><ns0:path d="M335,54 L392,54" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:path d="M392,54 L385.857,57.356" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:path d="M392,54 L385.857,50.644" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:circle cx="412" cy="54" r="13" fill="white" stroke="#151515" stroke-width="1.5" /><ns0:path d="M172,96 L234,137" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:path d="M234,137 L227.025,136.411" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:path d="M234,137 L230.727,130.812" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:rect x="245" y="121" width="82" height="32" fill="white" stroke="#151515" stroke-width="1.3" /><ns0:path d="M335,137 L392,137" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:path d="M392,137 L385.857,140.356" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:path d="M392,137 L385.857,133.644" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:circle cx="412" cy="137" r="13" fill="white" stroke="#151515" stroke-width="1.5" /><ns0:text x="286" y="58" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">A</ns0:text><ns0:text x="286" y="141" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">B</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">32-byte scalar</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">public-key encodings</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">20-byte hash</ns0:text></ns0:g></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.38× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">A scalar is encoded as exactly 32 big-endian bytes,</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">multiplied by G, serialized and hashed. P2PKH</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">comparisons use the address&#x27;s decoded 20-byte hash.</text><text x="550" y="946.05" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">32-byte scalar</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">public-key encodings</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">20-byte hash</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Existing checkers use key.to_bytes(32,&#x27;big&#x27;), known scalar-one vectors and compressed/uncompressed</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">formats. They compare HASH160 directly rather than Base58-encoding every generated address, an</text><text x="60" y="1282.8" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">equivalent target check.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / EXECUTED RECORD</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Left-padded scalar inputs, compressed/uncompressed public keys and known scalar-one address vectors</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">guard verifier correctness.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S020, S027</text></svg>