<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>M197 — Residue/Legendre/coefficient distribution controls / enhanced thematic plate</title><desc>Compare coefficient, residue, Legendre-symbol and remainder distributions with matched random samples. Original finding: Random controls and KS/chi-square-style summaries distinguish transformation artifacts from candidate key bias.</desc><rect width="1200" height="1500" fill="white"/><defs><clipPath id="focus-M197"><rect x="61" y="821" width="423" height="280"/></clipPath></defs><path d="M48 38 L1152 38" fill="none" stroke="#151515" stroke-width="3"/><text x="49" y="70" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">12  /  RESIDUES / STRUCTURE</text><g transform="translate(1050 55) scale(.88)"><circle cx="86" cy="50" r="3" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="77.5776" cy="73.1404" r="3" fill="white" stroke="#151515" stroke-width="1"/><circle cx="56.2513" cy="85.4531" r="3" fill="white" stroke="#151515" stroke-width="1"/><circle cx="32" cy="81.1769" r="3" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="16.1711" cy="62.3127" r="3" fill="white" stroke="#151515" stroke-width="1"/><circle cx="16.1711" cy="37.6873" r="3" fill="white" stroke="#151515" stroke-width="1"/><circle cx="32" cy="18.8231" r="3" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="56.2513" cy="14.5469" r="3" fill="white" stroke="#151515" stroke-width="1"/><circle cx="77.5776" cy="26.8596" r="3" fill="white" stroke="#151515" stroke-width="1"/><circle cx="50" cy="50" r="2" fill="#151515" stroke="#151515" stroke-width="1"/><path d="M50,50 L86,50" fill="none" stroke="#151515" stroke-width="1.3"/></g><text x="49" y="109" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#151515">M197</text><text x="49" y="151" font-family="DejaVu Sans, sans-serif" font-size=