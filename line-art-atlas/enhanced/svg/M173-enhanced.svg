-width="0.7" /><ns0:rect x="62" y="104" width="19" height="15" fill="#151515" stroke="#777777" stroke-width="0.7" /><ns0:rect x="84" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="106" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="128" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="150" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="172" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="194" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="216" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="238" y="104" width="19" height="15" fill="#151515" stroke="#777777" stroke-width="0.7" /><ns0:rect x="260" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="282" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="304" y="104" width="19" height="15" fill="#151515" stroke="#777777" stroke-width="0.7" /><ns0:rect x="326" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="348" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="370" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="392" y="104" width="19" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">first-byte constraint</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">wallet-specific calls</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">key byte string</ns0:text></ns0:g></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.32× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">PHPCoinAddress applies its own bounded byte calls,</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">including a special first-byte range, around PHP&#x27;s</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">generator.</text><text x="550" y="946.05" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">first-byte constraint</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">wallet-specific calls</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">key byte string</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Dedicated wrappers reproduce those calls for both old and modern modes. Replaying plain mt_rand bytes</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">would omit this wallet-specific transformation and could miss its generated keys.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / IMPLEMENTED/REGISTRY</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Dedicated first-byte/range rules are modeled under both PHP generator modes.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S211</text></svg>