<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>M081 — Near-miss anomaly testing / enhanced thematic plate</title><desc>Judge proximity relative to the density and placement of the entire candidate set. Dense sets naturally create close numerical neighbors. Original finding: Compare nearest-candidate distances with uniform targets against the same candidate geometry; closeness alone is not a verified key.</desc><rect width="1200" height="1500" fill="white"/><defs><clipPath id="focus-M081"><rect x="61" y="821" width="423" height="280"/></clipPath></defs><path d="M48 38 L1152 38" fill="none" stroke="#151515" stroke-width="3"/><text x="49" y="70" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">05  /  BUCKETS / TRANSFER</text><g transform="translate(1050 55) scale(.88)"><rect x="9" y="23" width="34" height="60" fill="white" stroke="#151515" stroke-width="1"/><rect x="60" y="11" width="34" height="72" fill="white" stroke="#151515" stroke-width="1"/><path d="M29,19 L29,88" fill="none" stroke="#151515" stroke-width="2"/><path d="M80,7 L80,88" fill="none" stroke="#151515" stroke-width="2"/><path d="M44,45 L59,45" fill="none" stroke="#151515" stroke-width="1"/><path d="M59,45 L52.8569,48.356" fill="none" stroke="#151515" stroke-width="1"/><path d="M59,45 L52.8569,41.644" fill="none" stroke="#151515" stroke-width="1"/></g><text x="49" y="109" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#151515">M081</text><text x="49" y="151" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" text-anchor="start" fill="#333333">Near-miss anomaly testing</text><g transform="translate(48 214) scale(2.3)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:circle cx="234" cy="88" r="6" fill="#151515" stroke="#151515" stroke-width="1" /><ns0:circle cx="265" cy="112" r="4" fill="white" stroke="#151515" stroke-width="1.5" /><ns0:path d="M235,89 L264,111" fill="none" stroke="#777777" stroke-width="1" stroke-dasharray="2 4" /><ns0:circle cx="234" cy="88" r="35" fill="none" stroke="#c5c5c5" stroke-width="0.75" /><ns0:circle cx="234" cy="88" r="66" fill="none" stroke="#c5c5c5" stroke-width="0.75" /><ns0:path d="M308,136 L268,114" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:path d="M268,114 L275,114.02" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:path d="M268,114 L271.765,119.901" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:text x="357" y="150" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">distance</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">observed near miss</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">distance statistic</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">chance comparison</ns0:text></ns0:g></g><rect x="501.1" y="368.1" width="133.4" height="133.4" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="7 7"/><text x="492.1" y="358.1" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">D</text><text x="232" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">01</text><text x="600" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">02</text><text x="968" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">03</text><path d="M48 757 L1152 757" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">D / OPERATION DETAIL</text><rect x="60" y="820" width="425" height="282" fill="white" stroke="#777777" stroke-width="1"/><g clip-path="url(#focus-M081)"><g transform="translate(-732.81 533.966) scale(4.44828)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:circle cx="234" cy="88" r="6" fill="#151515" stroke="#151515" stroke-width="1" /><ns0:circle cx="265" cy="112" r="4" fill="white" stroke="#151515" stroke-width="1.5" /><ns0:path d="M235,89 L264,111" fill="none" stroke="#777777" stroke-width="1" stroke-dasharray="2 4" /><ns0:circle cx="234" cy="88" r="35" fill="none" stroke="#c5c5c5" stroke-width="0.75" /><ns0:circle cx="234" cy="88" r="66" fill="none" stroke="#c5c5c5" stroke-width="0.75" /><ns0:path d="M308,136 L268,114" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:path d="M268,114 L275,114.02" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:path d="M268,114 L271.765,119.901" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:text x="357" y="150" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">distance</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">observed near miss</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">distance statistic</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">chance comparison</ns0:text></ns0:g></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.93× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">Judge proximity relative to the density and placement of</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">the entire candidate set. Dense sets naturally create</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">close numerical neighbors.</text><text x="550" y="946.05" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">observed near miss</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">distance statistic</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">chance comparison</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">nearmiss_analysis.py holds the candidate geometry fixed, draws uniform targets in the same interval and</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">compares minimum distances. This is a diagnostic of chance closeness, not a new candidate verifier.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / EXECUTED RECORD</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Compare nearest-candidate distances with uniform targets against the same candidate geometry;</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">closeness alone is not a verified key.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S039, S040</text></svg>