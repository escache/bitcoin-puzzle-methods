<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>M096 — Electrum-v1 and Armory masking models / enhanced thematic plate</title><desc>Historical deterministic wallets can derive children by algorithms different from BIP32. Apply each modeled derivation before the puzzle mask. Original finding: Historical deterministic-wallet derivation families and creator-style masks have dedicated test scripts.</desc><rect width="1200" height="1500" fill="white"/><defs><clipPath id="focus-M096"><rect x="61" y="821" width="423" height="280"/></clipPath></defs><path d="M48 38 L1152 38" fill="none" stroke="#151515" stroke-width="3"/><text x="49" y="70" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">06  /  REGISTERS / GENERATORS</text><g transform="translate(1050 55) scale(.88)"><rect x="7" y="40" width="12" height="15" fill="#151515" stroke="#777777" stroke-width="0.7"/><rect x="22" y="40" width="12" height="15" fill="white" stroke="#777777" stroke-width="0.7"/><rect x="37" y="40" width="12" height="15" fill="#151515" stroke="#777777" stroke-width="0.7"/><rect x="52" y="40" width="12" height="15" fill="#151515" stroke="#777777" stroke-width="0.7"/><rect x="67" y="40" width="12" height="15" fill="white" stroke="#777777" stroke-width="0.7"/><rect x="82" y="40" width="12" height="15" fill="#151515" stroke="#777777" stroke-width="0.7"/><path d="M16 36 V13 H91 V79 H6 V50" fill="none" stroke="#151515" stroke-width="1"/></g><text x="49" y="109" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#151515">M096</text><text x="49" y="151" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" text-anchor="start" fill="#333333">Electrum-v1 and Armory masking models</text><g transform="translate(48 214) scale(2.3)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://