1" font-weight="normal" text-anchor="start" fill="#333333">replacing the order-finding arithmetic backend.</text><text x="550" y="917.7" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="946.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="946.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">same modulus and base</text><text x="550" y="976.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="976.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Python / GMP / Rust</text><text x="550" y="1006.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1006.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">order and time checks</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">The saved matrix records per-backend times and verifies identical orders. This isolates local</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">implementation constants; differences across operand sizes are not a clean universal scaling-law estimate.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / EXECUTED RECORD</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Shared modulus/base backend matrix records finite speedups; source/runtime differences are pinned in</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">historical manifests.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S225</text></svg>