<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>M213 — Classical BSGS multiplicative-order finder / enhanced thematic plate</title><desc>BSGS finds an exponent r with a^r=1 modulo N by matching stored small powers against larger steps. Original finding: Exact small-integer order traces and backend comparisons; stands in for an order oracle, not a quantum device.</desc><rect width="1200" height="1500" fill="white"/><defs><clipPath id="focus-M213"><rect x="61" y="821" width="423" height="280"/></clipPath></defs><path d="M48 38 L1152 38" fill="none" stroke="#151515" stroke-width="3"/><text x="49" y="70" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">14  /  CIRCUITS / RESOURCES</text><g transform="translate(1050 55) scale(.88)"><path d="M5,23 L95,23" fill="none" stroke="#777777" stroke-width="0.8"/><path d="M5,50 L95,50" fill="none" stroke="#777777" stroke-width="0.8"/><path d="M5,77 L95,77" fill="none" stroke="#777777" stroke-width="0.8"/><rect x="17" y="15" width="16" height="16" fill="white" stroke="#151515" stroke-width="1.3"/><rect x="42" y="42" width="16" height="16" fill="white" stroke="#151515" stroke-width="1.3"/><rect x="70" y="69" width="16" height="16" fill="white" stroke="#151515" stroke-width="1.3"/><path d="M50,23 L50,77" fill="none" stroke="#151515" stroke-width="1"/><circle cx="50" cy="23" r="3" fill="#151515" stroke="#151515" stroke-width="1"/></g><text x="49" y="109" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#151515">M213</text><text x="49" y="151" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" text-anchor="start" fill="#333333">Classical BSGS multiplicative-order finder</text><g transform="translate(48 214) scale(2.3)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-line