<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>M029 — Prior-weighted stratified kangaroo / enhanced thematic plate</title><desc>Split a known-point interval into strata and allocate more tame-walk effort where a supplied prior assigns greater probability. Original finding: Reweights interval effort when a genuine prior exists; flat priors reduce to ordinary allocation. Prior quality is unestablished for the unknown puzzle.</desc><rect width="1200" height="1500" fill="white"/><defs><clipPath id="focus-M029"><rect x="61" y="821" width="423" height="280"/></clipPath></defs><path d="M48 38 L1152 38" fill="none" stroke="#151515" stroke-width="3"/><text x="49" y="70" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">02  /  TRACKS / COLLISIONS</text><g transform="translate(1050 55) scale(.88)"><path d="M5,16 L30,28" fill="none" stroke="#151515" stroke-width="2.6"/><path d="M30,28 L49,47" fill="none" stroke="#151515" stroke-width="2.6"/><path d="M49,47 L72,43" fill="none" stroke="#151515" stroke-width="2.6"/><path d="M72,43 L94,64" fill="none" stroke="#151515" stroke-width="2.6"/><circle cx="5" cy="16" r="3.4" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="30" cy="28" r="3.4" fill="white" stroke="#151515" stroke-width="1"/><circle cx="49" cy="47" r="3.4" fill="white" stroke="#151515" stroke-width="1"/><circle cx="72" cy="43" r="3.4" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="94" cy="64" r="3.4" fill="white" stroke="#151515" stroke-width="1"/><path d="M5,81 L27,67" fill="none" stroke="#151515" stroke-width="1.1"/><path d="M27,67 L49,47" fill="none" stroke="#151515" stroke-width="1.1"/><circle cx="5" cy="81" r="2.7" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="27" cy="67" r="2.7" fill="white" stroke="#151515" stroke-width="1"/><circle cx="49" cy="47" r="2.7" fill="white" stroke="#151515" stroke-width="1"/><circle cx="49" cy="47" r="7" fill="white" stroke="#151515" stroke-width="1.5"/><circle cx="49" cy="47" r="2" fill="#151515" stroke="#151515" stroke-width="1"/></g><text x="49" y="109" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#151515">M029</text><text x="49" y="151" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" text-anchor="start" fill="#333333">Prior-weighted stratified kangaroo</text><g transform="translate(48 214) scale(2.3)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:rect x="48" y="129" width="27" height="22" fill="#ededed" stroke="#151515" stroke-width="0.7" /><ns0:rect x="102.286" y="108" width="27" height="43" fill="#ededed" stroke="#151515" stroke-width="0.7" /><ns0:rect x="156.571" y="69" width="27" height="82" fill="#ededed" stroke="#151515" stroke-width="0.7" /><ns0:rect x="210.857" y="30" width="27" height="121" fill="#151515" stroke="#151515" stroke-width="1" /><ns0:rect x="265.143" y="86" width="27" height="65" fill="#ededed" stroke="#151515" stroke-width="0.7" /><ns0:rect x="319.429" y="121" width="27" height="30" fill="#ededed" stroke="#151515" stroke-width="0.7" /><ns0:rect x="373.714" y="135" width="27" height="16" fill="#ededed" stroke="#151515" stroke-width="0.7" /><ns0:path d="M35,152 L449,152" fill="none" stroke="#151515" stroke-width="0.9" /><ns0:text x="240" y="20" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#777777" text-anchor="middle" font-weight="normal">relative allocation</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">interval strata</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">prior masses</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">weighted walk effort</ns0:text></ns0:g><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M45 24 V15 H438 V24" fill="none" stroke="#777777" stroke-width="0.75" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="240" y="40" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#777777" text-anchor="middle" font-weight="normal">shared work budget</ns0:text></g><rect x="432.1" y="299.1" width="269.1" height="257.6" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="7 7"/><text x="423.1" y="289.1" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">D</text><text x="232" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">01</text><text x="600" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">02</text><text x="968" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">03</text><path d="M48 757 L1152 757" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">D / OPERATION DETAIL</text><rect x="60" y="820" width="425" height="282" fill="white" stroke="#777777" stroke-width="1"/><g clip-path="url(#focus-M029)"><g transform="translate(-246.955 746.768) scale(2.30357)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:rect x="48" y="129" width="27" height="22" fill="#ededed" stroke="#151515" stroke-width="0.7" /><ns0:rect x="102.286" y="108" width="27" height="43" fill="#ededed" stroke="#151515" stroke-width="0.7" /><ns0:rect x="156.571" y="69" width="27" height="82" fill="#ededed" stroke="#151515" stroke-width="0.7" /><ns0:rect x="210.857" y="30" width="27" height="121" fill="#151515" stroke="#151515" stroke-width="1" /><ns0:rect x="265.143" y="86" width="27" height="65" fill="#ededed" stroke="#151515" stroke-width="0.7" /><ns0:rect x="319.429" y="121" width="27" height="30" fill="#ededed" stroke="#151515" stroke-width="0.7" /><ns0:rect x="373.714" y="135" width="27" height="16" fill="#ededed" stroke="#151515" stroke-width="0.7" /><ns0:path d="M35,152 L449,152" fill="none" stroke="#151515" stroke-width="0.9" /><ns0:text x="240" y="20" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#777777" text-anchor="middle" font-weight="normal">relative allocation</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">interval strata</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">prior masses</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">weighted walk effort</ns0:text></ns0:g><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M45 24 V15 H438 V24" fill="none" stroke="#777777" stroke-width="0.75" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="240" y="40" font-family="DejaVu Sans, sans-serif" font-size="9" fill="#777777" text-anchor="middle" font-weight="normal">shared work budget</ns0:text></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.00× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">Split a known-point interval into strata and allocate</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">more tame-walk effort where a supplied prior assigns</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">greater probability.</text><text x="550" y="946.05" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">interval strata</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">prior masses</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">weighted walk effort</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">pwsk.py builds a smoothed histogram, assigns budgets using prior mass and width, and searches against a</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">shared wild herd. Its benefit depends on the supplied prior actually predicting targets.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / IMPLEMENTED</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Reweights interval effort when a genuine prior exists; flat priors reduce to ordinary allocation. Prior quality</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">is unestablished for the unknown puzzle.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S101, S076</text></svg>