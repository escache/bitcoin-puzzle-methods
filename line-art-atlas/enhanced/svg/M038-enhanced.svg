e="#151515" stroke-width="1" /><ns0:circle cx="338" cy="116" r="1.4" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="338" cy="125" r="1.4" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="338" cy="134" r="1.4" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="338" cy="143" r="1.4" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="347" cy="116" r="1.4" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="347" cy="125" r="1.4" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="347" cy="134" r="1.4" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="347" cy="143" r="1.4" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="356" cy="116" r="1.4" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="356" cy="125" r="1.4" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="356" cy="134" r="1.4" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="356" cy="143" r="1.4" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="365" cy="116" r="1.4" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="365" cy="125" r="1.4" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="365" cy="134" r="1.4" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:circle cx="365" cy="143" r="1.4" fill="#151515" stroke="#151515" stroke-width="0" /><ns0:text x="343" y="42" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">layer</ns0:text><ns0:path d="M330,48 L307,59" fill="none" stroke="#777777" stroke-width="0.7" /><ns0:text x="352" y="160" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">residual</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">original scalar</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">cube + layer</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">residual</ns0:text></ns0:g><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="139" y="93" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#151515" text-anchor="middle" font-weight="normal">R^3</ns0:text><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M158,89 L185,89" fill="none" stroke="#777777" stroke-width="0.8" /><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M185,89 L178.857,92.356" fill="none" stroke="#777777" stroke-width="0.8" /><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M185,89 L178.857,85.644" fill="none" stroke="#777777" stroke-width="0.8" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="396" y="131" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#777777" text-anchor="middle" font-weight="normal">D</ns0:text><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M384,128 L370,128" fill="none" stroke="#777777" stroke-width="0.7" /></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.27× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">Set R1=floor(cuberoot(k)), divide k-R1^3 by R1^2, and</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">retain quotient C1 and remainder D1. This exactly</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">re-encodes k.</text><text x="550" y="946.05" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">original scalar</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">cube + layer</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">residual</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">The code reconstructs known scalars from those digits and checks bounds. For an unknown key the digits</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">are also unknown; an exact identity does not disclose them from the address.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / AUDITED/CORRECTED</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Exact reconstruction of known integers works; the representation itself supplies no unknown digits or</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">entropy reduction.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S084, S120</text></svg>