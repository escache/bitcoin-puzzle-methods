<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>M038 — Cubic scalar decomposition / enhanced thematic plate</title><desc>Set R1=floor(cuberoot(k)), divide k-R1^3 by R1^2, and retain quotient C1 and remainder D1. This exactly re-encodes k. Original finding: Exact reconstruction of known integers works; the representation itself supplies no unknown digits or entropy reduction.</desc><rect width="1200" height="1500" fill="white"/><defs><clipPath id="focus-M038"><rect x="61" y="821" width="423" height="280"/></clipPath></defs><path d="M48 38 L1152 38" fill="none" stroke="#151515" stroke-width="3"/><text x="49" y="70" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">03  /  VOLUMES / DECOMPOSITION</text><g transform="translate(1050 55) scale(.88)"><rect x="18" y="31" width="51" height="51" fill="#ededed" stroke="#151515" stroke-width="1.5"/><path d="M18 31 L41 14 H92 L69 31 M69 31 L92 14 V65 L69 82" fill="none" stroke="#151515" stroke-width="1.2"/><path d="M35,31 L35,82" fill="none" stroke="#c5c5c5" stroke-width="0.55"/><path d="M52,31 L52,82" fill="none" stroke="#c5c5c5" stroke-width="0.55"/></g><text x="49" y="109" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#151515">M038</text><text x="49" y="151" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" text-anchor="start" fill="#333333">Cubic scalar decomposition</text><g transform="translate(48 214) scale(2.3)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:path d="M190 57 l26 -18 h88 l-26 18 Z" fill="#ededed" stroke="#151515" stroke-width="1.2" /><ns0:rect x="190" y="57" width="88" height="88" fill="#ededed" stroke="#151515" stroke-width="1.5" /><ns0:path d="M278 57 l26 -18 v88 l-26 18" fill="none" stroke