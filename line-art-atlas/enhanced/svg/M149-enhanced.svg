75.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">leading-zero points</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">pairwise point offsets</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">relation tests</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">The script compares known corpora, GLV transforms, linear combinations, bounded BSGS differences and</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">generator recipes. Mask rarity must be evaluated conditional on the deliberate point-selection rule.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / IMPLEMENTED</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Tests mask statistics, membership, pairwise differences, GLV relations, linear combinations and bounded</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">BSGS offsets.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S176</text></svg>