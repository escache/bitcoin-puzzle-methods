<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>M135 — Known affine-related nonce recovery / enhanced thematic plate</title><desc>A known relation k2=a*k1+b between two ECDSA nonces supplies an extra equation that makes the signer scalar solvable. Original finding: Synthetic signature pairs validate the formula when the nonce relation is actually known. Applicability requires such a pair.</desc><rect width="1200" height="1500" fill="white"/><defs><clipPath id="focus-M135"><rect x="61" y="821" width="423" height="280"/></clipPath></defs><path d="M48 38 L1152 38" fill="none" stroke="#151515" stroke-width="3"/><text x="49" y="70" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">09  /  SIGNATURES / CONSTRAINTS</text><g transform="translate(1050 55) scale(.88)"><rect x="5" y="11" width="26" height="22" fill="white" stroke="#151515" stroke-width="1"/><rect x="5" y="69" width="26" height="22" fill="white" stroke="#151515" stroke-width="1"/><path d="M32,23 L59,50" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M32,80 L59,50" fill="none" stroke="#151515" stroke-width="1.3"/><circle cx="64" cy="50" r="11" fill="#ededed" stroke="#151515" stroke-width="1.3"/><path d="M76,50 L97,50" fill="none" stroke="#151515" stroke-width="1.4"/><path d="M97,50 L90.8569,53.356" fill="none" stroke="#151515" stroke-width="1.4"/><path d="M97,50 L90.8569,46.644" fill="none" stroke="#151515" stroke-width="1.4"/></g><text x="49" y="109" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#151515">M135</text><text x="49" y="151" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" text-anchor="start" fill="#333333">Known affine-related nonce recovery</text><g transform="translate(48 214) scale(2.3)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.o