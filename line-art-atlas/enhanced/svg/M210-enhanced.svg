 clip-path="url(#focus-M210)"><g transform="translate(-352.955 704.303) scale(2.60606)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:rect x="44" y="58" width="62" height="40" fill="#ededed" stroke="#151515" stroke-width="1.6" /><ns0:rect x="198" y="12" width="62" height="40" fill="#ededed" stroke="#151515" stroke-width="1.6" /><ns0:rect x="340" y="90" width="62" height="40" fill="#ededed" stroke="#151515" stroke-width="1.6" /><ns0:path d="M111,65 L191,36" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M191,36 L186.368,41.2486" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M191,36 L184.081,34.9385" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M265,46 L337,95" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M337,95 L330.033,94.3182" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M337,95 L333.81,88.7693" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M365 135 Q205 183 81 105" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M90,114 L81,105" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M81,105 L87.7168,106.971" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M81,105 L82.9708,111.717" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">first / second</ns0:text><ns0:text x="80" y="215" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">differences</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">drift summaries</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">choose next operation</ns0:text></ns0:g></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.13× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">Measure first/second differences and choose the next</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">transformation based on drift or entropy summaries.</text><text x="550" y="917.7" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="946.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="946.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">first / second differences</text><text x="550" y="976.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="976.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">drift summaries</text><text x="550" y="1006.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1006.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">choose next operation</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">The framework&#x27;s schedulers switch among existing maps using their configured rules. Adaptation</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">optimizes trajectory diagnostics; it is not rewarded by an independently discovered target-key relation.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / IMPLEMENTED</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Analyze trajectory differences or switch transformations using entropy thresholds; diagnostic evolution is</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">not key recovery.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S189</text></svg>