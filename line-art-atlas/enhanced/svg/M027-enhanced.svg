h="1.7" /><ns0:path d="M357,72 L423,132" fill="none" stroke="#151515" stroke-width="1.7" /><ns0:circle cx="240" cy="22" r="6" fill="#151515" stroke="#151515" stroke-width="1" /><ns0:circle cx="118" cy="72" r="6" fill="#151515" stroke="#151515" stroke-width="1" /><ns0:circle cx="357" cy="72" r="6" fill="#151515" stroke="#151515" stroke-width="1" /><ns0:circle cx="55" cy="132" r="6" fill="white" stroke="#151515" stroke-width="1" /><ns0:circle cx="175" cy="132" r="6" fill="#151515" stroke="#151515" stroke-width="1" /><ns0:circle cx="302" cy="132" r="6" fill="white" stroke="#151515" stroke-width="1" /><ns0:circle cx="423" cy="132" r="6" fill="#151515" stroke="#151515" stroke-width="1" /><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">base hypotheses</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">shifted targets</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">shared herd work</ns0:text></ns0:g></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 0.98× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">Share walks or targets across several related base</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">hypotheses, attempting to reuse work instead of solving</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">each independently.</text><text x="550" y="946.05" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">base hypotheses</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">shifted targets</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">shared herd work</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Wrapped-CT code constructs multiple shifted targets. Historical audits inspect span/setup growth and find</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">that the advertised tiny-span benefit does not transfer unconditionally to high-index targets.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / AUDITED/CORRECTED</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Historical small-span speed claims fail on large required spans; later audits reject unconditional</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">recovery-cost reductions.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S114, S135</text></svg>