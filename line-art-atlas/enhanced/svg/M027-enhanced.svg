<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>M027 — Wrapped CT multi-target kangaroo / enhanced thematic plate</title><desc>Share walks or targets across several related base hypotheses, attempting to reuse work instead of solving each independently. Original finding: Historical small-span speed claims fail on large required spans; later audits reject unconditional recovery-cost reductions.</desc><rect width="1200" height="1500" fill="white"/><defs><clipPath id="focus-M027"><rect x="61" y="821" width="423" height="280"/></clipPath></defs><path d="M48 38 L1152 38" fill="none" stroke="#151515" stroke-width="3"/><text x="49" y="70" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">02  /  TRACKS / COLLISIONS</text><g transform="translate(1050 55) scale(.88)"><path d="M5,16 L30,28" fill="none" stroke="#151515" stroke-width="2.6"/><path d="M30,28 L49,47" fill="none" stroke="#151515" stroke-width="2.6"/><path d="M49,47 L72,43" fill="none" stroke="#151515" stroke-width="2.6"/><path d="M72,43 L94,64" fill="none" stroke="#151515" stroke-width="2.6"/><circle cx="5" cy="16" r="3.4" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="30" cy="28" r="3.4" fill="white" stroke="#151515" stroke-width="1"/><circle cx="49" cy="47" r="3.4" fill="white" stroke="#151515" stroke-width="1"/><circle cx="72" cy="43" r="3.4" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="94" cy="64" r="3.4" fill="white" stroke="#151515" stroke-width="1"/><path d="M5,81 L27,67" fill="none" stroke="#151515" stroke-width="1.1"/><path d="M27,67 L49,47" fill="none" stroke="#151515" stroke-width="1.1"/><circle cx="5" cy="81" r="2.7" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="27" cy="67" r="2.7" fill="white" stroke="#151515" stroke-width="1"/><circle cx="49" cy="47" r="2.7" fill="white" stroke="#151515" stroke-width="1"/><circle cx="49" cy="47" r="7" fill="white" st