"#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">candidate x value</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">two possible y lifts</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">compressed public keys</ns0:text></ns0:g></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.38× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">A valid x-coordinate has up to two curve-point lifts, each</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">yielding a possible compressed public key and address</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">hash.</text><text x="550" y="946.05" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">candidate x value</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">two possible y lifts</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">compressed public keys</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">The binary audit checks both parities against puzzle targets. This tests whether the dump literally contains</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">the target public key, not whether arbitrary points can be inverted into scalars.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / EXECUTED RECORD</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Both point parities were checked against puzzle addresses; no match in the recorded binary sample.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S150</text></svg>