<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>M147 — DP x-coordinates as candidate public keys / enhanced thematic plate</title><desc>A valid x-coordinate has up to two curve-point lifts, each yielding a possible compressed public key and address hash. Original finding: Both point parities were checked against puzzle addresses; no match in the recorded binary sample.</desc><rect width="1200" height="1500" fill="white"/><defs><clipPath id="focus-M147"><rect x="61" y="821" width="423" height="280"/></clipPath></defs><path d="M48 38 L1152 38" fill="none" stroke="#151515" stroke-width="3"/><text x="49" y="70" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">10  /  GRAPHS / RELATIONS</text><g transform="translate(1050 55) scale(.88)"><path d="M13,50 L44,15" fill="none" stroke="#151515" stroke-width="1"/><path d="M13,50 L44,84" fill="none" stroke="#151515" stroke-width="1"/><path d="M44,15 L73,50" fill="none" stroke="#151515" stroke-width="1"/><path d="M44,84 L73,50" fill="none" stroke="#151515" stroke-width="1"/><path d="M73,50 L95,12" fill="none" stroke="#151515" stroke-width="1"/><path d="M73,50 L95,88" fill="none" stroke="#151515" stroke-width="1"/><circle cx="13" cy="50" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="44" cy="15" r="4" fill="white" stroke="#151515" stroke-width="1"/><circle cx="44" cy="84" r="4" fill="white" stroke="#151515" stroke-width="1"/><circle cx="73" cy="50" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="95" cy="12" r="4" fill="white" stroke="#151515" stroke-width="1"/><circle cx="95" cy="88" r="4" fill="white" stroke="#151515" stroke-width="1"/></g><text x="49" y="109" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#151515">M147</text><text x="49" y="151" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" text-anchor="star