ct x="466.6" y="326.7" width="266.8" height="227.7" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="7 7"/><text x="457.6" y="316.7" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">D</text><text x="232" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">01</text><text x="600" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">02</text><text x="968" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">03</text><path d="M48 757 L1152 757" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">D / OPERATION DETAIL</text><rect x="60" y="820" width="425" height="282" fill="white" stroke="#777777" stroke-width="1"/><g clip-path="url(#focus-M045)"><g transform="translate(-352.955 704.303) scale(2.60606)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:path d="M35,96 L445,96" fill="none" stroke="#151515" stroke-width="1.5" /><ns0:path d="M35,83 L35,109" fill="none" stroke="#151515" stroke-width="2" /><ns0:path d="M445,83 L445,109" fill="none" stroke="#151515" stroke-width="2" /><ns0:rect x="175" y="68" width="104" height="56" fill="#ededed" stroke="none" stroke-width="1" /><ns0:path d="M175,96 L279,96" fill="none" stroke="#151515" stroke-width="4" /><ns0:path d="M175,62 L175,130" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M279,62 L279,130" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M177,40 L276,40" fill="none" stroke="#151515" stroke-width="2" /><ns0:path d="M276,40 L269.857,43.356" fill="none" stroke="#151515" stroke-width="2" /><ns0:path d="M276,40 L269.857,36.644" fill="none" stroke="#151515" stroke-width="2" /><ns0:text x="225" y="30" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">1</ns0:text><ns0:path d="M295,145 L428,145" fill="none" stroke="#777777" stroke-width="0.9" /><ns0:path d="M428,145 L421.857,148.356" fill="none" stroke="#777777" stroke-width="0.9" /><ns0:path d="M428,145 L421.857,141.644" fill="none" stroke="#777777" stroke-width="0.9" /><ns0:path d="M164,145 L50,145" fill="none" stroke="#777777" stroke-width="0.9" /><ns0:path d="M50,145 L56.1431,141.644" fill="none" stroke="#777777" stroke-width="0.9" /><ns0:path d="M50,145 L56.1431,148.356" fill="none" stroke="#777777" stroke-width="0.9" /><ns0:text x="240" y="154" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#777777" text-anchor="middle" font-weight="normal">2</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">D1 domain</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">ratio band first</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">then all other values</ns0:text></ns0:g></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.13× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">Search the ratio band first; if it misses, search all</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">remaining D1 values. This preserves eventual full leaf</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">coverage.</text><text x="550" y="946.05" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">D1 domain</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">ratio band first</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">then all other values</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Preset builders generate phase-one and complementary phase-two jobs. The combined policy restores</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">eligibility but can cost more than a single unpartitioned interval search.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / IMPLEMENTED</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Prioritize a calibrated band and search its remainder after a miss. Union coverage restores full range</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">rather than reducing entropy.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S086, S135</text></svg>