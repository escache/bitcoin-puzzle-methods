<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>M171 — Modern PHP MT19937 byte-fill replay / enhanced thematic plate</title><desc>Modern PHP mt_rand uses MT19937 and particular range-output rules. Repeated byte requests determine a key from its seed. Original finding: PHP 7.1+ generator/range semantics are modeled separately from legacy PHP.</desc><rect width="1200" height="1500" fill="white"/><defs><clipPath id="focus-M171"><rect x="61" y="821" width="423" height="280"/></clipPath></defs><path d="M48 38 L1152 38" fill="none" stroke="#151515" stroke-width="3"/><text x="49" y="70" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">11  /  SEEDS / ENTROPY</text><g transform="translate(1050 55) scale(.88)"><circle cx="26" cy="48" r="17" fill="white" stroke="#151515" stroke-width="1.5"/><circle cx="26" cy="48" r="3" fill="#151515" stroke="#151515" stroke-width="1"/><path d="M47,48 L70,48" fill="none" stroke="#151515" stroke-width="1.5"/><path d="M70,48 L63.8569,51.356" fill="none" stroke="#151515" stroke-width="1.5"/><path d="M70,48 L63.8569,44.644" fill="none" stroke="#151515" stroke-width="1.5"/><rect x="76" y="17" width="18" height="63" fill="#ededed" stroke="#151515" stroke-width="1"/><path d="M79,28 L92,28" fill="none" stroke="#777777" stroke-width="0.6"/><path d="M79,43 L92,43" fill="none" stroke="#777777" stroke-width="0.6"/><path d="M79,58 L92,58" fill="none" stroke="#777777" stroke-width="0.6"/><path d="M79,73 L92,73" fill="none" stroke="#777777" stroke-width="0.6"/></g><text x="49" y="109" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#151515">M171</text><text x="49" y="151" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" text-anchor="start" fill="#333333">Modern PHP MT19937 byte-fill replay</text><g transform="translate(48 214) scale(2.3)"><ns0:rect xmlns:ns0="http://www.w3.org/200