777777" stroke-width="0.8" /><ns0:path d="M62,72 L136,72" fill="none" stroke="#777777" stroke-width="0.8" /><ns0:path d="M62,90 L136,90" fill="none" stroke="#777777" stroke-width="0.8" /><ns0:path d="M62,108 L136,108" fill="none" stroke="#777777" stroke-width="0.8" /><ns0:path d="M62,126 L136,126" fill="none" stroke="#777777" stroke-width="0.8" /><ns0:path d="M166,92 L221,92" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M221,92 L214.857,95.356" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M221,92 L214.857,88.644" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M255 56 L292 92 L255 128 L219 92 Z" fill="#ededed" stroke="#151515" stroke-width="1.6" /><ns0:path d="M300,92 L379,92" fill="none" stroke="#151515" stroke-width="2.4" /><ns0:path d="M379,92 L372.857,95.356" fill="none" stroke="#151515" stroke-width="2.4" /><ns0:path d="M379,92 L372.857,88.644" fill="none" stroke="#151515" stroke-width="2.4" /><ns0:circle cx="408" cy="92" r="15" fill="white" stroke="#151515" stroke-width="1.8" /><ns0:text x="255" y="97" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#151515" text-anchor="middle" font-weight="normal">bounds</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">point and bounds</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">solver manifest</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">external solver</ns0:text></ns0:g></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.37× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">External interval solvers need bounds, a target point</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">and runtime settings in their expected configuration</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">format.</text><text x="550" y="946.05" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">point and bounds</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">solver manifest</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">external solver</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Export scripts write JeanLucPons/RCKangaroo inputs from puzzle or slot metadata. They prepare jobs;</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">whether the external executable ran and found a match requires separate logs.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / IMPLEMENTED</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Generate solver configuration files for public-key interval targets; configuration existence is not execution</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">evidence.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S090, S188</text></svg>