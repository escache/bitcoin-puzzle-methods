,82" fill="none" stroke="#151515" stroke-width="2.6" /><ns0:path d="M258,82 L337,104" fill="none" stroke="#151515" stroke-width="2.6" /><ns0:path d="M337,104 L431,75" fill="none" stroke="#151515" stroke-width="2.6" /><ns0:circle cx="42" cy="98" r="3.4" fill="#151515" stroke="#151515" stroke-width="1" /><ns0:circle cx="111" cy="75" r="3.4" fill="white" stroke="#151515" stroke-width="1" /><ns0:circle cx="181" cy="108" r="3.4" fill="white" stroke="#151515" stroke-width="1" /><ns0:circle cx="258" cy="82" r="3.4" fill="#151515" stroke="#151515" stroke-width="1" /><ns0:circle cx="337" cy="104" r="3.4" fill="white" stroke="#151515" stroke-width="1" /><ns0:circle cx="431" cy="75" r="3.4" fill="white" stroke="#151515" stroke-width="1" /><ns0:rect x="215" y="28" width="83" height="36" fill="white" stroke="#151515" stroke-width="1.5" /><ns0:text x="257" y="51" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">state</ns0:text><ns0:path d="M258,79 L258,65" fill="none" stroke="#151515" stroke-width="1" /><ns0:path d="M258,65 L261.356,71.1431" fill="none" stroke="#151515" stroke-width="1" /><ns0:path d="M258,65 L254.644,71.1431" fill="none" stroke="#151515" stroke-width="1" /><ns0:path d="M291 50 Q375 3 419 54" fill="none" stroke="#777777" stroke-width="1.1" stroke-dasharray="3 4" /><ns0:path d="M419,54 L425,63" fill="none" stroke="#777777" stroke-width="1.1" /><ns0:path d="M425,63 L418.8,59.7502" fill="none" stroke="#777777" stroke-width="1.1" /><ns0:path d="M425,63 L424.385,56.0271" fill="none" stroke="#777777" stroke-width="1.1" /><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">walk position</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">save state</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">resume and cross-check</ns0:text></ns0:g></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.27× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">Saving traversal state allows a restart at the next</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">unchecked position. Independent scalar multiplication</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">can detect incremental-point drift.</text><text x="550" y="946.05" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">walk position</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">save state</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">resume and cross-check</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">The worker writes an atomic status file and retains its offset/stride across restarts. The optimized version</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">checks the first and each 10,000th point against the original verifier.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / IMPLEMENTED</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Live optimization resumes the exact saved position and compares against full scalar multiplication every</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">10,000 entries.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S007, S004</text></svg>