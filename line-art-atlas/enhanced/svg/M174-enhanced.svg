ill="none" stroke="#151515" stroke-width="2" /><ns0:path d="M316,105 L309.174,106.553" fill="none" stroke="#151515" stroke-width="2" /><ns0:path d="M316,105 L311.006,100.095" fill="none" stroke="#151515" stroke-width="2" /><ns0:path d="M316,106 L181,67" fill="none" stroke="#777777" stroke-width="1" stroke-dasharray="3 4" /><ns0:path d="M181,67 L187.833,65.4808" fill="none" stroke="#777777" stroke-width="1" /><ns0:path d="M181,67 L185.97,71.9291" fill="none" stroke="#777777" stroke-width="1" /><ns0:path d="M88 79 V140 H251" fill="none" stroke="#151515" stroke-width="1" /><ns0:path d="M389 105 V42 H226" fill="none" stroke="#151515" stroke-width="1" /><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">two V8 states</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">multiply-with-carry</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">combined outputs</ns0:text></ns0:g></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.42× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">Old V8 Math.random combines multiply-with-carry state;</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">weakly seeded outputs can be reproduced and packed</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">into key bytes.</text><text x="550" y="946.05" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">two V8 states</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">multiply-with-carry</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">combined outputs</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">The registry supplies the historical MWC1616 byte-fill model. A full Randstorm wallet route may include</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">additional entropy mixing and consumption order not implied by that one modeled stream.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / IMPLEMENTED/REGISTRY</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Historical JavaScript Math.random byte generation model; a vulnerable-family model is not attribution to a</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">target wallet.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S211</text></svg>