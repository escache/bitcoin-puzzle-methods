 after multiple-model correction.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S008</text></svg>