<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>M119 — Weighted modular-diameter diversity / enhanced thematic plate</title><desc>The old statistic computes pairwise numeric spread and multiplies it by a subset-dependent average bias weight. Original finding: uint64 overflow, unsigned differences and unproved subset weights invalidate original diversity claims.</desc><rect width="1200" height="1500" fill="white"/><defs><clipPath id="focus-M119"><rect x="61" y="821" width="423" height="280"/></clipPath></defs><path d="M48 38 L1152 38" fill="none" stroke="#151515" stroke-width="3"/><text x="49" y="70" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">08  /  SETS / TOPOLOGY</text><g transform="translate(1050 55) scale(.88)"><path d="M7,17 L94,17" fill="none" stroke="#151515" stroke-width="4"/><path d="M7,38 L36,38" fill="none" stroke="#151515" stroke-width="3"/><path d="M65,38 L94,38" fill="none" stroke="#151515" stroke-width="3"/><path d="M7,59 L16.6667,59" fill="none" stroke="#151515" stroke-width="3"/><path d="M65,59 L74.6667,59" fill="none" stroke="#151515" stroke-width="3"/><path d="M26.3333,59 L36,59" fill="none" stroke="#151515" stroke-width="3"/><path d="M84.3333,59 L94,59" fill="none" stroke="#151515" stroke-width="3"/><path d="M7,80 L10.2222,80" fill="none" stroke="#151515" stroke-width="3"/><path d="M65,80 L68.2222,80" fill="none" stroke="#151515" stroke-width="3"/><path d="M26.3333,80 L29.5556,80" fill="none" stroke="#151515" stroke-width="3"/><path d="M84.3333,80 L87.5556,80" fill="none" stroke="#151515" stroke-width="3"/><path d="M13.4444,80 L16.6667,80" fill="none" stroke="#151515" stroke-width="3"/><path d="M71.4444,80 L74.6667,80" fill="none" stroke="#151515" stroke-width="3"/><path d="M32.7778,80 L36,80" fill="none" stroke="#151515" stroke-width="3"/><path d="M90.7778,80 L94,80" fill="none" stroke="#151515" stroke-width="3"/></g><text x="49" y="1