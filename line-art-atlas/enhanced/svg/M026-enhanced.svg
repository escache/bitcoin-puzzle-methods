d="M238 48 V21 H404 V52" fill="none" stroke="#777777" stroke-width="0.7" stroke-dasharray="3 4" /><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">public point Q</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">subtract base times G</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">D1 target point</ns0:text></ns0:g></g><rect x="531" y="333.6" width="207" height="188.6" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="7 7"/><text x="522" y="323.6" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">D</text><text x="232" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">01</text><text x="600" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">02</text><text x="968" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">03</text><path d="M48 757 L1152 757" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">D / OPERATION DETAIL</text><rect x="60" y="820" width="425" height="282" fill="white" stroke="#777777" stroke-width="1"/><g clip-path="url(#focus-M026)"><g transform="translate(-529.817 668.39) scale(3.14634)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:circle cx="74" cy="92" r="30" fill="white" stroke="#151515" stroke-width="1.7" /><ns0:text x="74" y="97" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#151515" text-anchor="middle" font-weight="normal">Q</ns0:text><ns0:path d="M113,92 L191,92" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M191,92 L184.857,95.356" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M191,92 L184.857,88.644" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:circle cx="238" cy="92" r="34" fill="#ededed" stroke="#151515" stroke-width="1.5" /><ns0:text x="238" y="87" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">subtract</ns0:text><ns0:text x="238" y="104" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">base x G</ns0:text><ns0:path d="M282,92 L359,92" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M359,92 L352.857,95.356" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M359,92 L352.857,88.644" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:circle cx="404" cy="92" r="30" fill="white" stroke="#151515" stroke-width="1.7" /><ns0:text x="404" y="97" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">D1 x G</ns0:text><ns0:path d="M238 48 V21 H404 V52" fill="none" stroke="#777777" stroke-width="0.7" stroke-dasharray="3 4" /><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">public point Q</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">subtract base times G</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">D1 target point</ns0:text></ns0:g></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.37× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">If k=base+D1, then Q-base*G=D1*G. A known base</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">converts recovery into a smaller interval discrete log.</text><text x="550" y="917.7" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="946.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="946.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">public point Q</text><text x="550" y="976.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="976.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">subtract base times G</text><text x="550" y="1006.7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1006.7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">D1 target point</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">D1 solvers construct the shifted point from guessed root/coefficient coordinates. A wrong base usually</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">makes the true key absent from that interval, so leaf cost alone is incomplete.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / IMPLEMENTED</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Subtract a hypothesized scalar base and search the D1 leaf; useful only if the hypothesized coordinates</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">are correct.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S114, S135</text></svg>