:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">current point</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">add delta times G</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">next point</ns0:text></ns0:g></g><rect x="466.6" y="326.7" width="266.8" height="227.7" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="7 7"/><text x="457.6" y="316.7" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">D</text><text x="232" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">01</text><text x="600" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">02</text><text x="968" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">03</text><path d="M48 757 L1152 757" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">D / OPERATION DETAIL</text><rect x="60" y="820" width="425" height="282" fill="white" stroke="#777777" stroke-width="1"/><g clip-path="url(#focus-M011)"><g transform="translate(-352.955 704.303) scale(2.60606)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:path d="M40,114 L98,75" fill="none" stroke="#151515" stroke-width="2.6" /><ns0:path d="M98,75 L161,99" fill="none" stroke="#151515" stroke-width="2.6" /><ns0:path d="M161,99 L223,51" fill="none" stroke="#151515" stroke-width="2.6" /><ns0:path d="M223,51 L296,87" fill="none" stroke="#151515" stroke-width="2.6" /><ns0:path d="M296,87 L361,56" fill="none" stroke="#151515" stroke-width="2.6" /><ns0:path d="M361,56 L438,106" fill="none" stroke="#151515" stroke-width="2.6" /><ns0:circle cx="40" cy="114" r="3.4" fill="#151515" stroke="#151515" stroke-width="1" /><ns0:circle cx="98" cy="75" r="3.4" fill="white" stroke="#151515" stroke-width="1" /><ns0:circle cx="161" cy="99" r="3.4" fill="white" stroke="#151515" stroke-width="1" /><ns0:circle cx="223" cy="51" r="3.4" fill="#151515" stroke="#151515" stroke-width="1" /><ns0:circle cx="296" cy="87" r="3.4" fill="white" stroke="#151515" stroke-width="1" /><ns0:circle cx="361" cy="56" r="3.4" fill="white" stroke="#151515" stroke-width="1" /><ns0:circle cx="438" cy="106" r="3.4" fill="#151515" stroke="#151515" stroke-width="1" /><ns0:circle cx="98" cy="75" r="8" fill="white" stroke="#151515" stroke-width="1.4" /><ns0:circle cx="98" cy="75" r="2" fill="#151515" stroke="#151515" stroke-width="1" /><ns0:circle cx="223" cy="51" r="8" fill="white" stroke="#151515" stroke-width="1.4" /><ns0:circle cx="223" cy="51" r="2" fill="#151515" stroke="#151515" stroke-width="1" /><ns0:circle cx="361" cy="56" r="8" fill="white" stroke="#151515" stroke-width="1.4" /><ns0:circle cx="361" cy="56" r="2" fill="#151515" stroke="#151515" stroke-width="1" /><ns0:text x="237" y="153" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#777777" text-anchor="middle" font-weight="normal">successive point updates</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">current point</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">add delta times G</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">next point</ns0:text></ns0:g></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.13× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">If the next scalar differs by delta, its public point is the</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">old point plus delta*G. Reusing that point avoids</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">repeated full scalar multiplication.</text><text x="550" y="946.05" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">current point</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">add delta times G</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">next point</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">point_walk.py caches the two step points needed by the affine traversal, including wraparound. It still</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">serializes and hashes every point; the candidate sequence is unchanged.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / EXECUTED RECORD</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Same scalar sequence verified using cached point increments; 900 comparison cases and paired</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">benchmarks passed.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S013, S012</text></svg>