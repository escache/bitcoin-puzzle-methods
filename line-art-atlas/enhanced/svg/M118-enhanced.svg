width="0.8" /><ns0:rect x="130" y="75" width="24" height="38" fill="white" stroke="#777777" stroke-width="0.8" /><ns0:path d="M166,95 L224,95" fill="none" stroke="#151515" stroke-width="2" /><ns0:path d="M224,95 L217.857,98.356" fill="none" stroke="#151515" stroke-width="2" /><ns0:path d="M224,95 L217.857,91.644" fill="none" stroke="#151515" stroke-width="2" /><ns0:path d="M240 70 L265 95 L240 120 L215 95 Z" fill="none" stroke="#151515" stroke-width="1.8" /><ns0:path d="M271,95 L335,95" fill="none" stroke="#151515" stroke-width="2" /><ns0:path d="M335,95 L328.857,98.356" fill="none" stroke="#151515" stroke-width="2" /><ns0:path d="M335,95 L328.857,91.644" fill="none" stroke="#151515" stroke-width="2" /><ns0:circle cx="365" cy="95" r="17" fill="white" stroke="#151515" stroke-width="2" /><ns0:path d="M240,126 L240,156" fill="none" stroke="#777777" stroke-width="0.9" /><ns0:path d="M240,156 L236.644,149.857" fill="none" stroke="#777777" stroke-width="0.9" /><ns0:path d="M240,156 L243.356,149.857" fill="none" stroke="#777777" stroke-width="0.9" /><ns0:text x="275" y="160" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#777777" text-anchor="middle" font-weight="normal">release</ns0:text><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">sample generator</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">JSON / JSONL records</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">million-record output</ns0:text></ns0:g></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.38× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">Serialize one record per generated candidate or</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">interval. JSONL allows records to be written one at a</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">time.</text><text x="550" y="946.05" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">sample generator</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">JSON / JSONL records</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">million-record output</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">The corrected run wrote a million descriptive records, then separately verified their sample keys and</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">boundaries. File size and record count measure storage and generation, not exhaustive cryptographic</text><text x="60" y="1282.8" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">coverage.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / EXECUTED RECORD</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Large record counts are data-generation work, not cryptographic search coverage; streaming JSONL avoids</text><text x="60" y="1387.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">all-record memory use.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S014, S003</text></svg>