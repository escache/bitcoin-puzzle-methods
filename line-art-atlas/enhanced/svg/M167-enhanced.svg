 d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">glibc state words</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">add feedback taps</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">truncated output bytes</ns0:text></ns0:g><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="330" y="22" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#777777" text-anchor="middle" font-weight="normal">feedback</ns0:text></g><rect x="519.5" y="260" width="165.6" height="186.3" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="7 7"/><text x="510.5" y="250" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">D</text><text x="232" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">01</text><text x="600" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">02</text><text x="968" y="646.4" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666666">03</text><path d="M48 757 L1152 757" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">D / OPERATION DETAIL</text><rect x="60" y="820" width="425" height="282" fill="white" stroke="#777777" stroke-width="1"/><g clip-path="url(#focus-M167)"><g transform="translate(-495.13 768.296) scale(3.18519)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:rect x="78" y="79" width="23" height="15" fill="#151515" stroke="#777777" stroke-width="0.7" /><ns0:rect x="104" y="79" width="23" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="130" y="79" width="23" height="15" fill="#151515" stroke="#777777" stroke-width="0.7" /><ns0:rect x="156" y="79" width="23" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="182" y="79" width="23" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="208" y="79" width="23" height="15" fill="#151515" stroke="#777777" stroke-width="0.7" /><ns0:rect x="234" y="79" width="23" height="15" fill="#151515" stroke="#777777" stroke-width="0.7" /><ns0:rect x="260" y="79" width="23" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="286" y="79" width="23" height="15" fill="#151515" stroke="#777777" stroke-width="0.7" /><ns0:rect x="312" y="79" width="23" height="15" fill="#151515" stroke="#777777" stroke-width="0.7" /><ns0:rect x="338" y="79" width="23" height="15" fill="white" stroke="#777777" stroke-width="0.7" /><ns0:rect x="364" y="79" width="23" height="15" fill="#151515" stroke="#777777" stroke-width="0.7" /><ns0:path d="M108,76 L108,35" fill="none" stroke="#151515" stroke-width="1.1" /><ns0:path d="M237,76 L237,35" fill="none" stroke="#151515" stroke-width="1.1" /><ns0:path d="M367,76 L367,35" fill="none" stroke="#151515" stroke-width="1.1" /><ns0:path d="M108,35 L412,35" fill="none" stroke="#151515" stroke-width="1.3" /><ns0:path d="M412 35 V140 H58 V94 H71" fill="none" stroke="#151515" stroke-width="1.5" /><ns0:circle cx="237" cy="35" r="9" fill="white" stroke="#151515" stroke-width="1.3" /><ns0:path d="M232,35 L242,35" fill="none" stroke="#151515" stroke-width="1" /><ns0:path d="M237,30 L237,40" fill="none" stroke="#151515" stroke-width="1" /><ns0:path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65" /><ns0:text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">glibc state words</ns0:text><ns0:text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">add feedback taps</ns0:text><ns0:text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">truncated output bytes</ns0:text></ns0:g><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="330" y="22" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#777777" text-anchor="middle" font-weight="normal">feedback</ns0:text></g></g><text x="60" y="1128" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#777777">Vector detail / 1.38× main-view scale</text><text x="550" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">HOW THE OPERATION WORKS</text><text x="550" y="835" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">glibc rand/random uses additive-feedback state;</text><text x="550" y="863.35" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">truncating its outputs to bytes can make keys</text><text x="550" y="891.7" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#333333">reproducible from a small seed.</text><text x="550" y="946.05" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#666666">READ THE THREE STAGES</text><text x="550" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">01</text><text x="600" y="975.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">glibc state words</text><text x="550" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">02</text><text x="600" y="1005.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">add feedback taps</text><text x="550" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#666666">03</text><text x="600" y="1035.05" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">truncated output bytes</text><path d="M48 1162 L1152 1162" fill="none" stroke="#bcbcbc" stroke-width="1"/><text x="60" y="1195" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">WHAT WAS ACTUALLY DONE</text><text x="60" y="1228" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">The family model initializes and warms the state, then emits low bytes under the catalog&#x27;s byte-fill recipe.</text><text x="60" y="1255.4" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Generator fidelity is tested separately from applicability to a target wallet.</text><text x="60" y="1328" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#555555">ORIGINAL FINDING / IMPLEMENTED/REGISTRY</text><text x="60" y="1360" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#333333">Models clock-seeded additive-feedback output truncated into key bytes.</text><path d="M48 1451 L1152 1451" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="49" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#666666">METHODS, DRAWN / ENHANCED THEMATIC EDITION</text><text x="1150" y="1478" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#666666">SCHEMATIC • S211</text></svg>