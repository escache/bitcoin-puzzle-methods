<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>M075 — Transferred within-bucket share / enhanced thematic plate</title><desc>Transfer a fraction of a donor bucket rather than its raw offset so buckets of different sizes can be compared. Original finding: Reuse disclosed normalized root-bucket shares at legal target roots; tests do not cover arbitrary offset functions.</desc><rect width="1200" height="1500" fill="white"/><defs><clipPath id="focus-M075"><rect x="61" y="821" width="423" height="280"/></clipPath></defs><path d="M48 38 L1152 38" fill="none" stroke="#151515" stroke-width="3"/><text x="49" y="70" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#555555">05  /  BUCKETS / TRANSFER</text><g transform="translate(1050 55) scale(.88)"><rect x="9" y="23" width="34" height="60" fill="white" stroke="#151515" stroke-width="1"/><rect x="60" y="11" width="34" height="72" fill="white" stroke="#151515" stroke-width="1"/><path d="M29,19 L29,88" fill="none" stroke="#151515" stroke-width="2"/><path d="M80,7 L80,88" fill="none" stroke="#151515" stroke-width="2"/><path d="M44,45 L59,45" fill="none" stroke="#151515" stroke-width="1"/><path d="M59,45 L52.8569,48.356" fill="none" stroke="#151515" stroke-width="1"/><path d="M59,45 L52.8569,41.644" fill="none" stroke="#151515" stroke-width="1"/></g><text x="49" y="109" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#151515">M075</text><text x="49" y="151" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="bold" text-anchor="start" fill="#333333">Transferred within-bucket share</text><g transform="translate(48 214) scale(2.3)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" width="480" height="235" fill="white" /><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round"><ns0:rect x="53" y="51" width="141" height="82" fill="white" st