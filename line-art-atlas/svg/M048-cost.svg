<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M048 — Post-slot square-root cost scaling</title><desc>Kangaroo leaf work scales roughly with the square root of its interval width, conditional on the correct target interval. Source finding: Count leaf cost conditional on a correct slot; audits warn against omitting the number of unknown slots.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><rect x="48" y="129" width="27" height="22" fill="#ededed" stroke="#151515" stroke-width="0.7"/><rect x="102.286" y="108" width="27" height="43" fill="#ededed" stroke="#151515" stroke-width="0.7"/><rect x="156.571" y="69" width="27" height="82" fill="#ededed" stroke="#151515" stroke-width="0.7"/><rect x="210.857" y="30" width="27" height="121" fill="#151515" stroke="#151515" stroke-width="1"/><rect x="265.143" y="86" width="27" height="65" fill="#ededed" stroke="#151515" stroke-width="0.7"/><rect x="319.429" y="121" width="27" height="30" fill="#ededed" stroke="#151515" stroke-width="0.7"/><rect x="373.714" y="135" width="27" height="16" fill="#ededed" stroke="#151515" stroke-width="0.7"/><path d="M35,152 L449,152" fill="none" stroke="#151515" stroke-width="0.9"/><path d="M45 137 Q180 60 432 32" fill="none" stroke="#151515" stroke-width="2.4"/><text x="358" y="24" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">work curve</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">slot widths</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">square-root work</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">sum over slots</text></g></svg>