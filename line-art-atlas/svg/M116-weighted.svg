<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M116 — Original HP-RTE weighted shard sampling</title><desc>The original recipe samples a key, derives a byte/nibble label and uses its assigned weight to move the output into a biased subrange. Source finding: Historical float-based biased generator excludes part of the advertised interval; corrected pipeline uses full-support integer partitions.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><rect x="48" y="129" width="27" height="22" fill="#ededed" stroke="#151515" stroke-width="0.7"/><rect x="102.286" y="108" width="27" height="43" fill="#ededed" stroke="#151515" stroke-width="0.7"/><rect x="156.571" y="69" width="27" height="82" fill="#ededed" stroke="#151515" stroke-width="0.7"/><rect x="210.857" y="30" width="27" height="121" fill="#151515" stroke="#151515" stroke-width="1"/><rect x="265.143" y="86" width="27" height="65" fill="#ededed" stroke="#151515" stroke-width="0.7"/><rect x="319.429" y="121" width="27" height="30" fill="#ededed" stroke="#151515" stroke-width="0.7"/><rect x="373.714" y="135" width="27" height="16" fill="#ededed" stroke="#151515" stroke-width="0.7"/><path d="M35,152 L449,152" fill="none" stroke="#151515" stroke-width="0.9"/><text x="240" y="20" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#777777" text-anchor="middle" font-weight="normal">relative allocation</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">keyspace shards</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">HP-RTE weights</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">distributed samples</text></g></svg>