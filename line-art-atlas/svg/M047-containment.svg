<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M047 — All-known-key slot containment</title><desc>A complete hypothesis includes every base digit needed to define the final searched interval. Test whether the published answer lies in that interval. Source finding: Check whether a generated complete slot includes a published answer; containment is not independent discovery of that answer.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M35,96 L445,96" fill="none" stroke="#151515" stroke-width="1.5"/><path d="M35,83 L35,109" fill="none" stroke="#151515" stroke-width="2"/><path d="M445,83 L445,109" fill="none" stroke="#151515" stroke-width="2"/><rect x="55" y="70" width="85" height="50" fill="#ededed" stroke="#777777" stroke-width="0.8"/><rect x="180" y="70" width="110" height="50" fill="#ededed" stroke="#777777" stroke-width="0.8"/><rect x="340" y="70" width="85" height="50" fill="#ededed" stroke="#777777" stroke-width="0.8"/><circle cx="232" cy="96" r="7" fill="#151515" stroke="#151515" stroke-width="1"/><path d="M232,39 L232,78" fill="none" stroke="#151515" stroke-width="1.2"/><text x="232" y="29" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">known answer</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">full slot list</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">known answer</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">inside or outside</text></g></svg>