<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M002 — Small-range exhaustive address search</title><desc>Enumerate every integer in a genuinely small interval and accept only an address match. Exhaustion gives a complete answer for that interval. Source finding: Puzzles 1-10 scanned completely; each yielded the expected published key. Small-range recovery is not an unknown-key breakthrough.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M35,96 L445,96" fill="none" stroke="#151515" stroke-width="1.5"/><path d="M35,83 L35,109" fill="none" stroke="#151515" stroke-width="2"/><path d="M445,83 L445,109" fill="none" stroke="#151515" stroke-width="2"/><circle cx="48" cy="96" r="3" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="72" cy="96" r="3" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="96" cy="96" r="3" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="120" cy="96" r="3" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="144" cy="96" r="3" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="168" cy="96" r="3" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="192" cy="96" r="3" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="216" cy="96" r="3" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="240" cy="96" r="3" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="264" cy="96" r="3" fill="white" stroke="#151515" stroke-width="1"/><circle cx="288" cy="96" r="3" fill="white" stroke="#151515" stroke-width="1"/><circle cx="312" cy="96" r="3" fill="white" stroke="#151515" stroke-width="1"/><circle cx="336" cy="96" r="3" fill="white" stroke="#151515" stroke-width="1"/><circle cx="360" cy="96" r="3" fill="white" stroke="#151515" stroke-width="1"/><circle cx="384" cy="96" r="3" fill="white" stroke="#151515" stroke-width="1"/><circle cx="408" cy="96" r="3" fill="white" stroke="#151515" stroke-width="1"/><circle cx="432" cy="96" r="3" fill="white" stroke="#151515" stroke-width="1"/><path d="M50,62 L250,62" fill="none" stroke="#151515" stroke-width="2.2"/><path d="M250,62 L243.857,65.356" fill="none" stroke="#151515" stroke-width="2.2"/><path d="M250,62 L243.857,58.644" fill="none" stroke="#151515" stroke-width="2.2"/><text x="310" y="66" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#777777" text-anchor="middle" font-weight="normal">next</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">interval start</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">check each value</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">interval end</text></g></svg>