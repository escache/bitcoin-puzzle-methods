<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M150 — Cross-artifact relation bundles</title><desc>Bundle source hashes, parsed values and named relationships so later investigations can trace every clue to its artifact. Source finding: Package DP, metadata and CTheory evidence without claiming that correlated artifacts reveal a key.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M68,85 L190,30" fill="none" stroke="#151515" stroke-width="2.4"/><path d="M68,85 L190,85" fill="none" stroke="#777777" stroke-width="0.8"/><path d="M68,85 L190,144" fill="none" stroke="#777777" stroke-width="0.8"/><path d="M190,30 L320,39" fill="none" stroke="#151515" stroke-width="2.4"/><path d="M190,85 L320,39" fill="none" stroke="#777777" stroke-width="0.8"/><path d="M190,85 L320,127" fill="none" stroke="#777777" stroke-width="0.8"/><path d="M190,144 L320,127" fill="none" stroke="#151515" stroke-width="2.4"/><path d="M320,39 L432,84" fill="none" stroke="#777777" stroke-width="0.8"/><path d="M320,127 L432,84" fill="none" stroke="#777777" stroke-width="0.8"/><circle cx="68" cy="85" r="8" fill="#151515" stroke="#151515" stroke-width="1.3"/><circle cx="190" cy="30" r="5" fill="white" stroke="#151515" stroke-width="1.3"/><circle cx="190" cy="85" r="8" fill="#151515" stroke="#151515" stroke-width="1.3"/><circle cx="190" cy="144" r="5" fill="white" stroke="#151515" stroke-width="1.3"/><circle cx="320" cy="39" r="5" fill="white" stroke="#151515" stroke-width="1.3"/><circle cx="320" cy="127" r="5" fill="white" stroke="#151515" stroke-width="1.3"/><circle cx="432" cy="84" r="5" fill="white" stroke="#151515" stroke-width="1.3"/><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">hashed artifacts</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">named evidence edges</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">traceable relation</text><text x="400" y="215" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">bundle</text></g></svg>