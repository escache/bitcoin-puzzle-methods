<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M121 — Exact ordinary diameter diagnostic</title><desc>Diameter is the largest value minus the smallest. With fixed normalization it describes a finite sample&#x27;s coordinate spread exactly. Source finding: Integer max-minus-min measures sample spread without claiming convergence or cryptographic proximity.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><circle cx="65" cy="75" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="102" cy="116" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="150" cy="46" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="237" cy="89" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="297" cy="53" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="344" cy="128" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="414" cy="82" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><path d="M65,75 L414,82" fill="none" stroke="#151515" stroke-width="2.8"/><circle cx="65" cy="75" r="9" fill="none" stroke="#151515" stroke-width="0.8"/><circle cx="414" cy="82" r="9" fill="none" stroke="#151515" stroke-width="0.8"/><path d="M65 146 H414 M65 140 V152 M414 140 V152" fill="none" stroke="#151515" stroke-width="1.2"/><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">ordinary point set</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">farthest pair</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">exact diameter</text></g></svg>