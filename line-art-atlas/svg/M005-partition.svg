<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M005 — Exact integer partition coverage</title><desc>Integer division places adjoining boundaries so the first shard starts at the lower limit and the last ends at the upper limit. Source finding: Gap-free inclusive intervals replace biased single-key records. Exhaustive small-range checks verify the partition arithmetic.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M35,96 L445,96" fill="none" stroke="#151515" stroke-width="1.5"/><path d="M35,83 L35,109" fill="none" stroke="#151515" stroke-width="2"/><path d="M445,83 L445,109" fill="none" stroke="#151515" stroke-width="2"/><rect x="35" y="63" width="51.25" height="64" fill="#ededed" stroke="#777777" stroke-width="0.8"/><rect x="86.25" y="63" width="51.25" height="64" fill="white" stroke="#777777" stroke-width="0.8"/><rect x="137.5" y="63" width="51.25" height="64" fill="#ededed" stroke="#777777" stroke-width="0.8"/><rect x="188.75" y="63" width="51.25" height="64" fill="white" stroke="#777777" stroke-width="0.8"/><rect x="240" y="63" width="51.25" height="64" fill="#ededed" stroke="#777777" stroke-width="0.8"/><rect x="291.25" y="63" width="51.25" height="64" fill="white" stroke="#777777" stroke-width="0.8"/><rect x="342.5" y="63" width="51.25" height="64" fill="#ededed" stroke="#777777" stroke-width="0.8"/><rect x="393.75" y="63" width="51.25" height="64" fill="white" stroke="#777777" stroke-width="0.8"/><text x="240" y="151" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#777777" text-anchor="middle" font-weight="normal">disjoint integer intervals</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">integer bounds</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">adjoining shards</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">no gaps</text></g></svg>