<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M009 — Generate-and-verify streaming batches</title><desc>Generate a candidate, verify it immediately, then discard it unless it matches. Memory does not grow with the batch size. Source finding: One million additional samples checked immediately without a large dataset; no matches in the saved batch.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><rect x="50" y="75" width="24" height="38" fill="white" stroke="#777777" stroke-width="0.8"/><rect x="90" y="75" width="24" height="38" fill="white" stroke="#777777" stroke-width="0.8"/><rect x="130" y="75" width="24" height="38" fill="white" stroke="#777777" stroke-width="0.8"/><path d="M166,95 L224,95" fill="none" stroke="#151515" stroke-width="2"/><path d="M224,95 L217.857,98.356" fill="none" stroke="#151515" stroke-width="2"/><path d="M224,95 L217.857,91.644" fill="none" stroke="#151515" stroke-width="2"/><path d="M240 70 L265 95 L240 120 L215 95 Z" fill="none" stroke="#151515" stroke-width="1.8"/><path d="M271,95 L335,95" fill="none" stroke="#151515" stroke-width="2"/><path d="M335,95 L328.857,98.356" fill="none" stroke="#151515" stroke-width="2"/><path d="M335,95 L328.857,91.644" fill="none" stroke="#151515" stroke-width="2"/><circle cx="365" cy="95" r="17" fill="white" stroke="#151515" stroke-width="2"/><path d="M240,126 L240,156" fill="none" stroke="#777777" stroke-width="0.9"/><path d="M240,156 L236.644,149.857" fill="none" stroke="#777777" stroke-width="0.9"/><path d="M240,156 L243.356,149.857" fill="none" stroke="#777777" stroke-width="0.9"/><text x="275" y="160" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#777777" text-anchor="middle" font-weight="normal">release</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">generate</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">verify now</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">discard or retain</text></g></svg>