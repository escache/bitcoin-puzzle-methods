<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M065 — Remainder precision granted true roots</title><desc>Give a predictor the true root coordinates to isolate whether it can predict the remaining offset accurately enough. Source finding: Measures exact offset-prediction errors even when root coordinates are supplied; coarse root prediction does not supply leaf precision.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M45,55 L433,55" fill="none" stroke="#c5c5c5" stroke-width="0.8"/><circle cx="53" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="92" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="131" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="170" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="209" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="248" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="287" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="326" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="365" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="404" cy="55" r="3.5" fill="#151515" stroke="#151515" stroke-width="0"/><path d="M45,123 L433,123" fill="none" stroke="#c5c5c5" stroke-width="0.8"/><circle cx="53" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0"/><circle cx="92" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0"/><circle cx="131" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0"/><circle cx="170" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0"/><circle cx="209" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0"/><circle cx="248" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0"/><circle cx="287" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0"/><circle cx="326" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0"/><circle cx="365" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0"/><circle cx="404" cy="123" r="3.5" fill="#777777" stroke="#151515" stroke-width="0"/><rect x="175" y="28" width="131" height="49" fill="#ededed" stroke="#151515" stroke-width="1.2"/><text x="240" y="57" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">supplied truth</text><rect x="175" y="98" width="131" height="49" fill="white" stroke="#151515" stroke-width="1.2"/><text x="240" y="128" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">estimated</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">true roots supplied</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">predict remainder</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">measure residual error</text></g></svg>