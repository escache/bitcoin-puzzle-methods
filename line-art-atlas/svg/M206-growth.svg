<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M206 — All-value magnitude/growth tracking</title><desc>Track magnitudes, signs, divisibility and growth of every entry across every difference level, including after an earlier event. Source finding: More than 23 million entry observations distinguish growth from termination; unresolved finite caps are not nontermination proofs.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><rect x="48" y="142" width="27" height="9" fill="#ededed" stroke="#151515" stroke-width="0.7"/><rect x="102.286" y="137" width="27" height="14" fill="#ededed" stroke="#151515" stroke-width="0.7"/><rect x="156.571" y="128" width="27" height="23" fill="#ededed" stroke="#151515" stroke-width="0.7"/><rect x="210.857" y="112" width="27" height="39" fill="#151515" stroke="#151515" stroke-width="1"/><rect x="265.143" y="91" width="27" height="60" fill="#ededed" stroke="#151515" stroke-width="0.7"/><rect x="319.429" y="62" width="27" height="89" fill="#ededed" stroke="#151515" stroke-width="0.7"/><rect x="373.714" y="26" width="27" height="125" fill="#ededed" stroke="#151515" stroke-width="0.7"/><path d="M35,152 L449,152" fill="none" stroke="#151515" stroke-width="0.9"/><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">all signed values</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">track every level</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">magnitude growth</text></g></svg>