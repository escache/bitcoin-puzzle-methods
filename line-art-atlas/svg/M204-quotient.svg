<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M204 — Signed quotient hierarchy with common-factor removal</title><desc>Keep signed integer differences and divide a row by m whenever every entry shares that factor before taking the next difference. Source finding: Remove factors of the full modulus before continuing signed differences; zero, cycle and capped outcomes remain separate.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><rect x="57" y="38" width="44" height="30" fill="white" stroke="#151515" stroke-width="1"/><text x="79" y="59" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">12</text><rect x="113" y="38" width="44" height="30" fill="white" stroke="#151515" stroke-width="1"/><text x="135" y="59" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">18</text><rect x="169" y="38" width="44" height="30" fill="white" stroke="#151515" stroke-width="1"/><text x="191" y="59" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">6</text><rect x="225" y="38" width="44" height="30" fill="white" stroke="#151515" stroke-width="1"/><text x="247" y="59" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">24</text><path d="M290,53 L360,53" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M360,53 L353.857,56.356" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M360,53 L353.857,49.644" fill="none" stroke="#151515" stroke-width="1.3"/><text x="331" y="34" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">divide by 6</text><rect x="57" y="112" width="44" height="30" fill="#ededed" stroke="#151515" stroke-width="1"/><text x="79" y="133" font-family="DejaVu Sans, sans-seri