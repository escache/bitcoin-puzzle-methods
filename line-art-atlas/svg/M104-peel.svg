<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M104 — Nested previous-key tail grow/peel</title><desc>Build the next sparse value by embedding the previous entire value under a new frame, and reverse that operation by peeling the frame. Source finding: Distinguishes nested-tail updates from fixed-tail co-shifts; the two agree at one construction step, not generally.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M190 57 l26 -18 h88 l-26 18 Z" fill="#ededed" stroke="#151515" stroke-width="1.2"/><rect x="190" y="57" width="88" height="88" fill="#ededed" stroke="#151515" stroke-width="1.5"/><path d="M278 57 l26 -18 v88 l-26 18" fill="none" stroke="#151515" stroke-width="1.2"/><path d="M212,57 L212,145" fill="none" stroke="#c5c5c5" stroke-width="0.5"/><path d="M190,79 L278,79" fill="none" stroke="#c5c5c5" stroke-width="0.5"/><path d="M234,57 L234,145" fill="none" stroke="#c5c5c5" stroke-width="0.5"/><path d="M190,101 L278,101" fill="none" stroke="#c5c5c5" stroke-width="0.5"/><path d="M256,57 L256,145" fill="none" stroke="#c5c5c5" stroke-width="0.5"/><path d="M190,123 L278,123" fill="none" stroke="#c5c5c5" stroke-width="0.5"/><path d="M190,81 L278,81" fill="none" stroke="#151515" stroke-width="2.6"/><path d="M293,80 L379,51" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M379,51 L374.251,56.1429" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M379,51 L372.107,49.7829" fill="none" stroke="#151515" stroke-width="1.3"/><rect x="385" y="35" width="28" height="28" fill="white" stroke="#151515" stroke-width="1.3"/><text x="88" y="103" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">remove</text><path d="M133,98 L177,98" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M177,98 L170.857,101.356" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M177,98 L170.857,94.644" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">previous key tail</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">grow or peel bits</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">nested candidate</text></g></svg>