<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M043 — Puzzle-bound clipping of D1</title><desc>Intersect a leaf&#x27;s D1 limits with the public puzzle bounds after subtracting its proposed base. Source finding: Historical audit records no useful narrowing for its high-index sample; advertised puzzle bounds are too broad at this leaf scale.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M35,96 L445,96" fill="none" stroke="#151515" stroke-width="1.5"/><path d="M35,83 L35,109" fill="none" stroke="#151515" stroke-width="2"/><path d="M445,83 L445,109" fill="none" stroke="#151515" stroke-width="2"/><rect x="65" y="46" width="237" height="35" fill="#ededed" stroke="#777777" stroke-width="0.8"/><rect x="190" y="109" width="232" height="35" fill="white" stroke="#777777" stroke-width="0.8"/><rect x="190" y="46" width="112" height="98" fill="#ededed" stroke="none" stroke-width="1"/><path d="M190,46 L190,144" fill="none" stroke="#151515" stroke-width="2.6"/><path d="M302,46 L302,144" fill="none" stroke="#151515" stroke-width="2.6"/><text x="246" y="166" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">intersection</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">leaf D1 range</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">puzzle bounds</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">intersection</text></g></svg>