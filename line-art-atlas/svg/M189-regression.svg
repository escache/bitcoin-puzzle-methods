<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M189 — Polynomial in puzzle number</title><desc>Fit a low-degree function of puzzle number and forecast later key positions or values. Source finding: Leave-one-out prediction compared with random keys; fitting known data does not determine the next scalar.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M43,151 L446,151" fill="none" stroke="#777777" stroke-width="0.8"/><path d="M43,151 L43,24" fill="none" stroke="#777777" stroke-width="0.8"/><circle cx="65" cy="132" r="3.5" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="120" cy="119" r="3.5" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="179" cy="102" r="3.5" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="237" cy="93" r="3.5" fill="white" stroke="#151515" stroke-width="1"/><circle cx="298" cy="62" r="3.5" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="356" cy="49" r="3.5" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="421" cy="32" r="3.5" fill="#151515" stroke="#151515" stroke-width="1"/><path d="M56 142 Q227 81 430 27" fill="none" stroke="#151515" stroke-width="2.4"/><path d="M57 151 Q225 96 430 45" fill="none" stroke="#c5c5c5" stroke-width="0.7"/><path d="M57 124 Q225 66 430 13" fill="none" stroke="#c5c5c5" stroke-width="0.7"/><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">puzzle indices</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">polynomial fit</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">later scalar estimate</text></g></svg>