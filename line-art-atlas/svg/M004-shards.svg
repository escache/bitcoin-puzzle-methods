<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M004 — Uniform within-shard representatives</title><desc>Divide an interval into nonoverlapping shards and select one integer uniformly within each. This spreads a batch over the advertised range. Source finding: Samples one integer per disjoint interval; representative checks do not exhaust their shard.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M35,96 L445,96" fill="none" stroke="#151515" stroke-width="1.5"/><path d="M35,83 L35,109" fill="none" stroke="#151515" stroke-width="2"/><path d="M445,83 L445,109" fill="none" stroke="#151515" stroke-width="2"/><rect x="35" y="63" width="51.25" height="64" fill="#ededed" stroke="#777777" stroke-width="0.8"/><circle cx="47" cy="95" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><rect x="86.25" y="63" width="51.25" height="64" fill="white" stroke="#777777" stroke-width="0.8"/><circle cx="115.25" cy="95" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><rect x="137.5" y="63" width="51.25" height="64" fill="#ededed" stroke="#777777" stroke-width="0.8"/><circle cx="154.5" cy="95" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><rect x="188.75" y="63" width="51.25" height="64" fill="white" stroke="#777777" stroke-width="0.8"/><circle cx="222.75" cy="95" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><rect x="240" y="63" width="51.25" height="64" fill="#ededed" stroke="#777777" stroke-width="0.8"/><circle cx="262" cy="95" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><rect x="291.25" y="63" width="51.25" height="64" fill="white" stroke="#777777" stroke-width="0.8"/><circle cx="330.25" cy="95" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><rect x="342.5" y="63" width="51.25" height="64" fill="#ededed" stroke="#777777" stroke-width="0.8"/><circle cx="369.5" cy="95" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><rect x="393.75" y="63" width="51.25" height="64" fill="white" stroke="#777777" stroke-width="0.8"/><circle cx="408.75" cy="95" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><text x="240" y="151" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#777777" text-anchor="middle" font-weight="normal">disjoint integer intervals</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">whole interval</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">one draw per shard</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">spread coverage</text></g></svg>