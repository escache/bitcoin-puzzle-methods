<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M220 — Semiprime-per-puzzle circuit/manifest analogy</title><desc>Construct a deterministic semiprime challenge from puzzle data to illustrate a comparable input size for factoring-resource calculations. Source finding: Factoring challenges derived from puzzle data are resource-scale analogies, not reductions recovering puzzle scalars.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M48,52 L433,52" fill="none" stroke="#777777" stroke-width="0.9"/><path d="M48,101 L433,101" fill="none" stroke="#777777" stroke-width="0.9"/><path d="M48,146 L433,146" fill="none" stroke="#777777" stroke-width="0.9"/><rect x="97" y="35" width="40" height="34" fill="white" stroke="#151515" stroke-width="1.4"/><text x="117" y="56" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#151515" text-anchor="middle" font-weight="normal">H</text><rect x="196" y="84" width="40" height="34" fill="white" stroke="#151515" stroke-width="1.4"/><text x="216" y="105" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#151515" text-anchor="middle" font-weight="normal">U</text><rect x="303" y="35" width="40" height="34" fill="white" stroke="#151515" stroke-width="1.4"/><text x="323" y="56" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#151515" text-anchor="middle" font-weight="normal">QFT</text><path d="M216,52 L216,146" fill="none" stroke="#151515" stroke-width="1.2"/><circle cx="216" cy="52" r="4" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="216" cy="146" r="8" fill="white" stroke="#151515" stroke-width="1.2"/><text x="367" y="164" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#777777" text-anchor="middle" font-weight="normal">schematic resource pipeline</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif"