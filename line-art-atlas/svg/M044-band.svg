<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M044 — D1 high-index ratio bands</title><desc>Estimate normalized D1 positions from solved examples and prioritize a common ratio band for new slots. Source finding: Calibrated narrow bands reduce width conditionally but miss held-out keys; their complement is required for complete support.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M35,96 L445,96" fill="none" stroke="#151515" stroke-width="1.5"/><path d="M35,83 L35,109" fill="none" stroke="#151515" stroke-width="2"/><path d="M445,83 L445,109" fill="none" stroke="#151515" stroke-width="2"/><rect x="175" y="68" width="104" height="56" fill="#ededed" stroke="none" stroke-width="1"/><path d="M175,96 L279,96" fill="none" stroke="#151515" stroke-width="4"/><path d="M175,62 L175,130" fill="none" stroke="#151515" stroke-width="1.8"/><path d="M279,62 L279,130" fill="none" stroke="#151515" stroke-width="1.8"/><text x="227" y="151" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">selected band</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">normalized D1</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">calibration band</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">prioritized values</text></g></svg>