<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M123 — Cantor-to-keyspace homeomorphism claim</title><desc>A homeomorphism must be a continuous bijection with a continuous inverse. An infinite Cantor set cannot be bijective with a finite integer keyspace. Source finding: Rounding real samples to finite keys is not a homeomorphism from an infinite Cantor set.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M40,31 L440,31" fill="none" stroke="#151515" stroke-width="5"/><path d="M40,67 L173.333,67" fill="none" stroke="#151515" stroke-width="3.2"/><path d="M306.667,67 L440,67" fill="none" stroke="#151515" stroke-width="3.2"/><path d="M40,103 L84.4444,103" fill="none" stroke="#151515" stroke-width="3.2"/><path d="M306.667,103 L351.111,103" fill="none" stroke="#151515" stroke-width="3.2"/><path d="M128.889,103 L173.333,103" fill="none" stroke="#151515" stroke-width="3.2"/><path d="M395.556,103 L440,103" fill="none" stroke="#151515" stroke-width="3.2"/><path d="M40,139 L54.8148,139" fill="none" stroke="#151515" stroke-width="3.2"/><path d="M306.667,139 L321.481,139" fill="none" stroke="#151515" stroke-width="3.2"/><path d="M128.889,139 L143.704,139" fill="none" stroke="#151515" stroke-width="3.2"/><path d="M395.556,139 L410.37,139" fill="none" stroke="#151515" stroke-width="3.2"/><path d="M69.6296,139 L84.4444,139" fill="none" stroke="#151515" stroke-width="3.2"/><path d="M336.296,139 L351.111,139" fill="none" stroke="#151515" stroke-width="3.2"/><path d="M158.519,139 L173.333,139" fill="none" stroke="#151515" stroke-width="3.2"/><path d="M425.185,139 L440,139" fill="none" stroke="#151515" stroke-width="3.2"/><text x="240" y="165" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#777777" text-anchor="middle" font-weight="normal">proposed mapping ?</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">Cantor-like encoding</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">proposed correspondence</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">finite keyspace</text></g></svg>