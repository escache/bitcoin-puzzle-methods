<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M011 — Incremental public-point verification</title><desc>If the next scalar differs by delta, its public point is the old point plus delta*G. Reusing that point avoids repeated full scalar multiplication. Source finding: Same scalar sequence verified using cached point increments; 900 comparison cases and paired benchmarks passed.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M40,114 L98,75" fill="none" stroke="#151515" stroke-width="2.6"/><path d="M98,75 L161,99" fill="none" stroke="#151515" stroke-width="2.6"/><path d="M161,99 L223,51" fill="none" stroke="#151515" stroke-width="2.6"/><path d="M223,51 L296,87" fill="none" stroke="#151515" stroke-width="2.6"/><path d="M296,87 L361,56" fill="none" stroke="#151515" stroke-width="2.6"/><path d="M361,56 L438,106" fill="none" stroke="#151515" stroke-width="2.6"/><circle cx="40" cy="114" r="3.4" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="98" cy="75" r="3.4" fill="white" stroke="#151515" stroke-width="1"/><circle cx="161" cy="99" r="3.4" fill="white" stroke="#151515" stroke-width="1"/><circle cx="223" cy="51" r="3.4" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="296" cy="87" r="3.4" fill="white" stroke="#151515" stroke-width="1"/><circle cx="361" cy="56" r="3.4" fill="white" stroke="#151515" stroke-width="1"/><circle cx="438" cy="106" r="3.4" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="98" cy="75" r="8" fill="white" stroke="#151515" stroke-width="1.4"/><circle cx="98" cy="75" r="2" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="223" cy="51" r="8" fill="white" stroke="#151515" stroke-width="1.4"/><circle cx="223" cy="51" r="2" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="361" cy="56" r="8" fill="white" stroke="#151515" stroke-width="1.4"/><circle cx="361" cy="56" r="2" fill="#151515" stroke="#151515" stroke-width="1"/><text x="237" y="153" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#777777" text-anchor="middle" font-weight="normal">successive point updates</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">current point</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">add delta times G</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">next point</text></g></svg>