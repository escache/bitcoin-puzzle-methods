<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M041 — Phase-2 Delta2 enumeration</title><desc>Given R2 and C2, each Delta2 selects an R1 through R1=R2^3+C2*R2^2+Delta2. Source finding: Enumerate feasible R1 values within each R2/C2 hypothesis; this is a search coordinate, not an independently observed point.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M240,22 L118,72" fill="none" stroke="#151515" stroke-width="1.7"/><path d="M240,22 L357,72" fill="none" stroke="#151515" stroke-width="1.7"/><path d="M118,72 L55,132" fill="none" stroke="#151515" stroke-width="1.7"/><path d="M118,72 L175,132" fill="none" stroke="#151515" stroke-width="1.7"/><path d="M357,72 L302,132" fill="none" stroke="#151515" stroke-width="1.7"/><path d="M357,72 L423,132" fill="none" stroke="#151515" stroke-width="1.7"/><circle cx="240" cy="22" r="6" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="118" cy="72" r="6" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="357" cy="72" r="6" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="55" cy="132" r="6" fill="white" stroke="#151515" stroke-width="1"/><circle cx="175" cy="132" r="6" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="302" cy="132" r="6" fill="white" stroke="#151515" stroke-width="1"/><circle cx="423" cy="132" r="6" fill="#151515" stroke="#151515" stroke-width="1"/><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">R2 and C2</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">Delta2 sweep</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">possible R