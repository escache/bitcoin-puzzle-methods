<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M083 — Blind nth-root ladder address tests</title><desc>Build nth-root scheduled anchors and difference-based forecasts without supplying the hidden scalar to the candidate generator. Source finding: Index-only, leave-one-out and random holdout candidates mostly match only trivial tiny puzzles; no unknown-target matches recorded.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><rect x="53" y="51" width="141" height="82" fill="white" stroke="#777777" stroke-width="1"/><rect x="53" y="96" width="80" height="37" fill="#ededed" stroke="none" stroke-width="1"/><path d="M133,43 L133,141" fill="none" stroke="#151515" stroke-width="2.4"/><circle cx="133" cy="96" r="5" fill="#151515" stroke="#151515" stroke-width="1"/><rect x="260" y="51" width="190" height="82" fill="white" stroke="#777777" stroke-width="1"/><rect x="260" y="96" width="107.801" height="37" fill="#ededed" stroke="none" stroke-width="1"/><path d="M367.801,43 L367.801,141" fill="none" stroke="#151515" stroke-width="2.4"/><circle cx="367.801" cy="96" r="5" fill="#151515" stroke="#151515" stroke-width="1"/><path d="M204,87 L249,87" fill="none" stroke="#151515" stroke-width="2"/><path d="M249,87 L242.857,90.356" fill="none" stroke="#151515" stroke-width="2"/><path d="M249,87 L242.857,83.644" fill="none" stroke="#151515" stroke-width="2"/><text x="122" y="31" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">root bucket</text><text x="365" y="31" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">normalized</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">nth-root ladder</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">finite anchors</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">address checks</text></g></svg>