<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M037 — Miss ladder and complement widening</title><desc>After a prioritized search misses, enlarge the hypothesis set in an explicit order rather than silently assuming the key was impossible. Source finding: Follow a failed narrow search with complement/full-range fallbacks, rather than treating heuristic misses as exclusions.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M35,96 L445,96" fill="none" stroke="#151515" stroke-width="1.5"/><path d="M35,83 L35,109" fill="none" stroke="#151515" stroke-width="2"/><path d="M445,83 L445,109" fill="none" stroke="#151515" stroke-width="2"/><path d="M207,52 L273,52" fill="none" stroke="#151515" stroke-width="3"/><path d="M207,45 L207,59" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M273,45 L273,59" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M151,94 L329,94" fill="none" stroke="#777777" stroke-width="1.3"/><path d="M151,87 L151,101" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M329,87 L329,101" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M57,137 L423,137" fill="none" stroke="#777777" stroke-width="1.3"/><path d="M57,130 L57,144" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M423,130 L423,144" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M240,62 L240,125" fill="none" stroke="#777777" stroke-width="0.9" stroke-dasharray="3 4"/><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">first search band</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">miss then enlarge</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">remaining complement</text></g></svg>