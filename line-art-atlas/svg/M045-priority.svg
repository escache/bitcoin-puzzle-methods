<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M045 — Two-phase D1 band/complement policy</title><desc>Search the ratio band first; if it misses, search all remaining D1 values. This preserves eventual full leaf coverage. Source finding: Prioritize a calibrated band and search its remainder after a miss. Union coverage restores full range rather than reducing entropy.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M35,96 L445,96" fill="none" stroke="#151515" stroke-width="1.5"/><path d="M35,83 L35,109" fill="none" stroke="#151515" stroke-width="2"/><path d="M445,83 L445,109" fill="none" stroke="#151515" stroke-width="2"/><rect x="175" y="68" width="104" height="56" fill="#ededed" stroke="none" stroke-width="1"/><path d="M175,96 L279,96" fill="none" stroke="#151515" stroke-width="4"/><path d="M175,62 L175,130" fill="none" stroke="#151515" stroke-width="1.8"/><path d="M279,62 L279,130" fill="none" stroke="#151515" stroke-width="1.8"/><path d="M177,40 L276,40" fill="none" stroke="#151515" stroke-width="2"/><path d="M276,40 L269.857,43.356" fill="none" stroke="#151515" stroke-width="2"/><path d="M276,40 L269.857,36.644" fill="none" stroke="#151515" stroke-width="2"/><text x="225" y="30" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">1</text><path d="M295,145 L428,145" fill="none" stroke="#777777" stroke-width="0.9"/><path d="M428,145 L421.857,148.356" fill="none" stroke="#777777" stroke-width="0.9"/><path d="M428,145 L421.857,141.644" fill="none" stroke="#777777" stroke-width="0.9"/><path d="M164,145 L50,145" fill="none" stroke="#777777" stroke-width="0.9"/><path d="M50,145 L56.1431,141.644" fill="none" stroke="#777777" stroke-width="0.9"/><path d="M50,145 L56.1431,148.356" fill="none" stroke="#777777" stroke-width="0.9"/><text x="240" y="154" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#777777" text-anchor="middle" font-weight="normal">2</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">D1 domain</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">ratio band first</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">then all other values</text></g></svg>