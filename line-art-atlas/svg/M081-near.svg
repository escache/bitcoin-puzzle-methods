<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M081 — Near-miss anomaly testing</title><desc>Judge proximity relative to the density and placement of the entire candidate set. Dense sets naturally create close numerical neighbors. Source finding: Compare nearest-candidate distances with uniform targets against the same candidate geometry; closeness alone is not a verified key.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><circle cx="234" cy="88" r="6" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="265" cy="112" r="4" fill="white" stroke="#151515" stroke-width="1.5"/><path d="M235,89 L264,111" fill="none" stroke="#777777" stroke-width="1" stroke-dasharray="2 4"/><circle cx="234" cy="88" r="35" fill="none" stroke="#c5c5c5" stroke-width="0.75"/><circle cx="234" cy="88" r="66" fill="none" stroke="#c5c5c5" stroke-width="0.75"/><path d="M308,136 L268,114" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M268,114 L275,114.02" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M268,114 L271.765,119.901" fill="none" stroke="#151515" stroke-width="1.3"/><text x="357" y="150" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">distance</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">observed near miss</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">distance statistic</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">chance comparison</text></g></svg>