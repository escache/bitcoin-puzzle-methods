<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M013 — FUSED priority-band traversal with fallback</title><desc>Search a forecast band first, then its complement. This can improve order under a good predictor without permanently excluding any key. Source finding: Fixed-budget test retained complementary regions; 286,720 checks across both methods found no keys.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M35,96 L445,96" fill="none" stroke="#151515" stroke-width="1.5"/><path d="M35,83 L35,109" fill="none" stroke="#151515" stroke-width="2"/><path d="M445,83 L445,109" fill="none" stroke="#151515" stroke-width="2"/><rect x="175" y="68" width="104" height="56" fill="#ededed" stroke="none" stroke-width="1"/><path d="M175,96 L279,96" fill="none" stroke="#151515" stroke-width="4"/><path d="M175,62 L175,130" fill="none" stroke="#151515" stroke-width="1.8"/><path d="M279,62 L279,130" fill="none" stroke="#151515" stroke-width="1.8"/><path d="M177,40 L276,40" fill="none" stroke="#151515" stroke-width="2"/><path d="M276,40 L269.857,43.356" fill="none" stroke="#151515" stroke-width="2"/><path d="M276,40 L269.857,36.644" fill="none" stroke="#151515" stroke-width="2"/><text x="225" y="30" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">1</text><path d="M295,145 L428,145" fill="none" stroke="#777777" stroke-width="0.9"/><path d="M428,145 L421.857,148.356" fill="none" stroke="#777777" stroke-width="0.9"/><path d="M428,145 L421.857,141.644" fill="none" stroke="#777777" stroke-width="0.9"/><path d="M164,145 L50,145" fill="none" stroke="#777777" stroke-width="0.9"/><path d="M50,145 L56.1431,141.644" fill="none" stroke="#777777" stroke-width="0.9"/><path d="M50,145 L56.1431,148.356" fill="none" stroke="#777777" stroke-width="0.9"/><text x="240" y="154" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#77777