<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M120 — Finite-sample Cauchy/convergence claims</title><desc>True Cauchyness and convergence require bounds over arbitrary sufficiently late terms of an infinite sequence, with the proposed limit included for convergence. Source finding: Sampling a finite history is not an asymptotic tail criterion; clustering cannot identify the unknown scalar.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M43,151 L446,151" fill="none" stroke="#777777" stroke-width="0.8"/><path d="M43,151 L43,24" fill="none" stroke="#777777" stroke-width="0.8"/><circle cx="64" cy="45" r="3.5" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="115" cy="120" r="3.5" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="174" cy="79" r="3.5" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="231" cy="101" r="3.5" fill="white" stroke="#151515" stroke-width="1"/><circle cx="291" cy="91" r="3.5" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="353" cy="96" r="3.5" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="421" cy="94" r="3.5" fill="#151515" stroke="#151515" stroke-width="1"/><path d="M64,45 L115,120" fill="none" stroke="#151515" stroke-width="1.1"/><path d="M115,120 L174,79" fill="none" stroke="#151515" stroke-width="1.1"/><path d="M174,79 L231,101" fill="none" stroke="#151515" stroke-width="1.1"/><path d="M231,101 L291,91" fill="none" stroke="#151515" stroke-width="1.1"/><path d="M291,91 L353,96" fill="none" stroke="#151515" stroke-width="1.1"/><path d="M353,96 L421,94" fill="none" stroke="#151515" stroke-width="1.1"/><circle cx="64" cy="45" r="2.7" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="115" cy="120" r="2.7" fill="white" stroke="#151515" stroke-width="1"/><circle cx="174" cy="79" r="2.7" fill="white" stroke="#151515" stroke-width="1"/><circle cx="231" cy="101" r="2.7" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="291" cy="91" r="2.7" fill="white" stroke="#151515" stroke-width="1"/><circle cx="353" cy="96" r="2.7" fill="white" stroke="#151515" stroke-width="1"/><circle cx="421" cy="94" r="2.7" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="231" cy="101" r="8" fill="white" stroke="#151515" stroke-width="1.2"/><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">finite sample sequence</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">pairwise closeness</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">convergence claim check</text></g></svg>