<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M109 — BFS Hamming balls and previous-key XOR</title><desc>Enumerate all masks up to a chosen Hamming weight around a seed, or XOR selected bits into a previous known key. Source finding: Check bounded low-Hamming-distance neighborhoods around seeds or prior keys; completeness is limited to that neighborhood.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><circle cx="240" cy="92" r="37" fill="none" stroke="#c5c5c5" stroke-width="0.7"/><circle cx="240" cy="92" r="72" fill="none" stroke="#c5c5c5" stroke-width="0.7"/><path d="M240,92 L312,92" fill="none" stroke="#c5c5c5" stroke-width="0.6"/><circle cx="312" cy="92" r="3.5" fill="#151515" stroke="#151515" stroke-width="1"/><path d="M240,92 L272.043,110.5" fill="none" stroke="#c5c5c5" stroke-width="0.6"/><circle cx="272.043" cy="110.5" r="3.5" fill="white" stroke="#151515" stroke-width="1"/><path d="M240,92 L276,154.354" fill="none" stroke="#c5c5c5" stroke-width="0.6"/><circle cx="276" cy="154.354" r="3.5" fill="white" stroke="#151515" stroke-width="1"/><path d="M240,92 L240,129" fill="none" stroke="#c5c5c5" stroke-width="0.6"/><circle cx="240" cy="129" r="3.5" fill="#151515" stroke="#151515" stroke-width="1"/><path d="M240,92 L204,154.354" fill="none" stroke="#c5c5c5" stroke-width="0.6"/><circle cx="204" cy="154.354" r="3.5" fill="white" stroke="#151515" stroke-width="1"/><path d="M240,92 L207.957,110.5" fill="none" stroke="#c5c5c5" stroke-width="0.6"/><circle cx="207.957" cy="110.5" r="3.5" fill="white" stroke="#151515" stroke-width="1"/><path d="M240,92 L168,92" fill="none" stroke="#c5c5c5" stroke-width="0.6"/><circle cx="168" cy="92" r="3.5" fill="#151515" stroke="#151515" stroke-width="1"/><path d="M240,92 L207.957,73.5" fill="none" stroke="#c5c5c5" stroke-width="0.6"/><circle cx="207.957" cy="73.5" r="3.5" fill="white" stroke="#151515" stroke-width="1"/><path d="M240,92