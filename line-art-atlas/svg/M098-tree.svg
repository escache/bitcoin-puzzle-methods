<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M098 — Supplied extended-key derivation leads</title><desc>An explicitly supplied extended private node allows deterministic child derivation along a bounded list of relative paths. Source finding: Three unique supplied leads tested over bounded relative paths/index shifts; no reproduction of nontrivial probe keys. Secrets are not included here.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M240,22 L118,72" fill="none" stroke="#151515" stroke-width="1.7"/><path d="M240,22 L357,72" fill="none" stroke="#151515" stroke-width="1.7"/><path d="M118,72 L55,132" fill="none" stroke="#151515" stroke-width="1.7"/><path d="M118,72 L175,132" fill="none" stroke="#151515" stroke-width="1.7"/><path d="M357,72 L302,132" fill="none" stroke="#151515" stroke-width="1.7"/><path d="M357,72 L423,132" fill="none" stroke="#151515" stroke-width="1.7"/><circle cx="240" cy="22" r="6" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="118" cy="72" r="6" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="357" cy="72" r="6" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="55" cy="132" r="6" fill="white" stroke="#151515" stroke-width="1"/><circle cx="175" cy="132" r="6" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="302" cy="132" r="6" fill="white" stroke="#151515" stroke-width="1"/><circle cx="423" cy="132" r="6" fill="#151515" stroke="#151515" stroke-width="1"/><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">supplied extended key</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">declared child paths</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">derived candidates</text></g></svg>