<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M207 — Inverse-difference kernel/anchor tests</title><desc>Group all starting rows that produce the same observed difference row. Additional anchors can select among these inverse candidates. Source finding: Enumerate compatible starting rows; anchors can resolve lost constants, but the residual hierarchy supplies no missing observations.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><rect x="346" y="68" width="79" height="47" fill="#ededed" stroke="#151515" stroke-width="1.6"/><rect x="47" y="30" width="78" height="26" fill="white" stroke="#777777" stroke-width="1"/><path d="M134,43 L330,92" fill="none" stroke="#777777" stroke-width="1"/><path d="M330,92 L323.226,93.7659" fill="none" stroke="#777777" stroke-width="1"/><path d="M330,92 L324.854,87.2543" fill="none" stroke="#777777" stroke-width="1"/><rect x="47" y="80" width="78" height="26" fill="white" stroke="#777777" stroke-width="1"/><path d="M134,93 L330,92" fill="none" stroke="#777777" stroke-width="1"/><path d="M330,92 L323.874,95.3873" fill="none" stroke="#777777" stroke-width="1"/><path d="M330,92 L323.84,88.6754" fill="none" stroke="#777777" stroke-width="1"/><rect x="47" y="130" width="78" height="26" fill="white" stroke="#777777" stroke-width="1"/><path d="M134,143 L330,92" fill="none" stroke="#777777" stroke-width="1"/><path d="M330,92 L324.9,96.7948" fill="none" stroke="#777777" stroke-width="1"/><path d="M330,92 L323.21,90.2991" fill="none" stroke="#777777" stroke-width="1"/><path d="M45,158 L125,158" fill="none" stroke="#151515" stroke-width="3"/><text x="214" y="157" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">extra anchor chooses one</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">shared difference row</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">many possible originals</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">anchor selects one</text></g></svg>