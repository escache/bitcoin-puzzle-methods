<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M132 — Puzzle-160 nonce/signing-key relation</title><desc>If an ECDSA nonce is the Puzzle-160 key, knowledge of either that nonce or the signer scalar determines the other algebraically. Source finding: Recover one scalar if the other is supplied; the published relation does not independently reveal either unknown key.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><rect x="47" y="28" width="92" height="34" fill="white" stroke="#151515" stroke-width="1.2"/><text x="93" y="49" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">signature</text><rect x="47" y="105" width="92" height="34" fill="white" stroke="#151515" stroke-width="1.2"/><text x="93" y="126" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">signature</text><circle cx="240" cy="83" r="21" fill="#ededed" stroke="#151515" stroke-width="1.7"/><text x="240" y="87" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">nonce</text><path d="M145,45 L219,76" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M145,122 L219,91" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M269,83 L349,83" fill="none" stroke="#151515" stroke-width="2.2"/><path d="M349,83 L342.857,86.356" fill="none" stroke="#151515" stroke-width="2.2"/><path d="M349,83 L342.857,79.644" fill="none" stroke="#151515" stroke-width="2.2"/><rect x="364" y="63" width="55" height="40" fill="white" stroke="#151515" stroke-width="1.2"/><text x="392" y="88" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">test</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">puzzle-160 signature</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">nonce / signing-key</text><text x="240" y="215" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">relation</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">public-point checks</text></g></svg>