<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M038 — Cubic scalar decomposition</title><desc>Set R1=floor(cuberoot(k)), divide k-R1^3 by R1^2, and retain quotient C1 and remainder D1. This exactly re-encodes k. Source finding: Exact reconstruction of known integers works; the representation itself supplies no unknown digits or entropy reduction.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M190 57 l26 -18 h88 l-26 18 Z" fill="#ededed" stroke="#151515" stroke-width="1.2"/><rect x="190" y="57" width="88" height="88" fill="#ededed" stroke="#151515" stroke-width="1.5"/><path d="M278 57 l26 -18 v88 l-26 18" fill="none" stroke="#151515" stroke-width="1.2"/><path d="M212,57 L212,145" fill="none" stroke="#c5c5c5" stroke-width="0.5"/><path d="M190,79 L278,79" fill="none" stroke="#c5c5c5" stroke-width="0.5"/><path d="M234,57 L234,145" fill="none" stroke="#c5c5c5" stroke-width="0.5"/><path d="M190,101 L278,101" fill="none" stroke="#c5c5c5" stroke-width="0.5"/><path d="M256,57 L256,145" fill="none" stroke="#c5c5c5" stroke-width="0.5"/><path d="M190,123 L278,123" fill="none" stroke="#c5c5c5" stroke-width="0.5"/><rect x="289" y="59" width="34" height="86" fill="white" stroke="#151515" stroke-width="1"/><circle cx="338" cy="116" r="1.4" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="338" cy="125" r="1.4" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="338" cy="134" r="1.4" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="338" cy="143" r="1.4" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="347" cy="116" r="1.4" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="347" cy="125" r="1.4" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="347" cy="134" r="1.4" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="347" cy="143" r="1.4" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="356" cy="116" r="1.4" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="356" cy="125" r="1.4" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="356" cy="134" r="1.4" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="356" cy="143" r="1.4" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="365" cy="116" r="1.4" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="365" cy="125" r="1.4" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="365" cy="134" r="1.4" fill="#151515" stroke="#151515" stroke-width="0"/><circle cx="365" cy="143" r="1.4" fill="#151515" stroke="#151515" stroke-width="0"/><text x="343" y="42" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">layer</text><path d="M330,48 L307,59" fill="none" stroke="#777777" stroke-width="0.7"/><text x="352" y="160" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">residual</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">original scalar</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">cube + layer</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">residual</text></g></svg>