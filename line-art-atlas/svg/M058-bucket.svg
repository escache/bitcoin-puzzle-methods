<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M058 — Strategic Delta2 ratio hints</title><desc>Reuse normalized Delta2 ratios from calibration keys to propose a short list of exact Delta2 values. Source finding: Target-in-calibration leakage explained the old 7/7 result; corrected blind high-index results were 0/7.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><rect x="53" y="51" width="141" height="82" fill="white" stroke="#777777" stroke-width="1"/><rect x="53" y="96" width="80" height="37" fill="#ededed" stroke="none" stroke-width="1"/><path d="M133,43 L133,141" fill="none" stroke="#151515" stroke-width="2.4"/><circle cx="133" cy="96" r="5" fill="#151515" stroke="#151515" stroke-width="1"/><rect x="260" y="51" width="190" height="82" fill="white" stroke="#777777" stroke-width="1"/><rect x="260" y="96" width="107.801" height="37" fill="#ededed" stroke="none" stroke-width="1"/><path d="M367.801,43 L367.801,141" fill="none" stroke="#151515" stroke-width="2.4"/><circle cx="367.801" cy="96" r="5" fill="#151515" stroke="#151515" stroke-width="1"/><path d="M204,87 L249,87" fill="none" stroke="#151515" stroke-width="2"/><path d="M249,87 L242.857,90.356" fill="none" stroke="#151515" stroke-width="2"/><path d="M249,87 L242.857,83.644" fill="none" stroke="#151515" stroke-width="2"/><text x="240" y="126" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#777777" text-anchor="middle" font-weight="normal">share</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">training Delta2 share</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">new R2 bucket</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">proposed Delta2</text></g></svg>