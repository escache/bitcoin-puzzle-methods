<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M026 — Direct D1 interval kangaroo</title><desc>If k=base+D1, then Q-base*G=D1*G. A known base converts recovery into a smaller interval discrete log. Source finding: Subtract a hypothesized scalar base and search the D1 leaf; useful only if the hypothesized coordinates are correct.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><circle cx="74" cy="92" r="30" fill="white" stroke="#151515" stroke-width="1.7"/><text x="74" y="97" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#151515" text-anchor="middle" font-weight="normal">Q</text><path d="M113,92 L191,92" fill="none" stroke="#151515" stroke-width="1.8"/><path d="M191,92 L184.857,95.356" fill="none" stroke="#151515" stroke-width="1.8"/><path d="M191,92 L184.857,88.644" fill="none" stroke="#151515" stroke-width="1.8"/><circle cx="238" cy="92" r="34" fill="#ededed" stroke="#151515" stroke-width="1.5"/><text x="238" y="87" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">subtract</text><text x="238" y="104" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">base x G</text><path d="M282,92 L359,92" fill="none" stroke="#151515" stroke-width="1.8"/><path d="M359,92 L352.857,95.356" fill="none" stroke="#151515" stroke-width="1.8"/><path d="M359,92 L352.857,88.644" fill="none" stroke="#151515" stroke-width="1.8"/><circle cx="404" cy="92" r="30" fill="white" stroke="#151515" stroke-width="1.7"/><text x="404" y="97" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">D1 x G</text><path d="M238 48 V21 H404 V52" fill="none" stroke="#777777" stroke-width="0.7" stroke-dasharray="3 4"/><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">public point Q</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">subtract base times G</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">D1 target point</text></g></svg>