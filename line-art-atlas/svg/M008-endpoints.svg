<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M008 — Range-start and range-end verification</title><desc>A range boundary is itself a possible private scalar and can be checked exactly like a sample. Checking it does not search its neighboring integers. Source finding: Two million endpoint entries checked in both address formats; no target match. Interiors were not searched.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M35,96 L445,96" fill="none" stroke="#151515" stroke-width="1.5"/><path d="M35,83 L35,109" fill="none" stroke="#151515" stroke-width="2"/><path d="M445,83 L445,109" fill="none" stroke="#151515" stroke-width="2"/><circle cx="35" cy="96" r="7" fill="#151515" stroke="#151515" stroke-width="1"/><circle cx="445" cy="96" r="7" fill="#151515" stroke="#151515" stroke-width="1"/><path d="M60,96 L420,96" fill="none" stroke="#c5c5c5" stroke-width="2" stroke-dasharray="3 8"/><text x="240" y="139" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#777777" text-anchor="middle" font-weight="normal">interior remains unchecked</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">lower boundary</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">unsearched interior</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">upper boundary</text></g></svg>