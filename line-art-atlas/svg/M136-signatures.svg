<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M136 — Counter nonces and small offset relation tests</title><desc>Guess tiny nonce values or small differences between two nonce values, then use ECDSA equations to derive a signer candidate. Source finding: Archived harvested-signature scans tested tiny nonces and bounded offsets; no verified wallet-key recovery reported.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><rect x="47" y="28" width="92" height="34" fill="white" stroke="#151515" stroke-width="1.2"/><text x="93" y="49" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">signature</text><rect x="47" y="105" width="92" height="34" fill="white" stroke="#151515" stroke-width="1.2"/><text x="93" y="126" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">signature</text><circle cx="240" cy="83" r="21" fill="#ededed" stroke="#151515" stroke-width="1.7"/><text x="240" y="87" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#151515" text-anchor="middle" font-weight="normal">nonce</text><path d="M145,45 L219,76" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M145,122 L219,91" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M269,83 L349,83" fill="none" stroke="#151515" stroke-width="2.2"/><path d="M349,83 L342.857,86.356" fill="none" stroke="#151515" stroke-width="2.2"/><path d="M349,83 L342.857,79.644" fill="none" stroke="#151515" stroke-width="2.2"/><rect x="364" y="63" width="55" height="40" fill="white" stroke="#151515" stroke-width="1.2"/><text x="392" y="88" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">test</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">counter nonces</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">small offset choices</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">relation checks</text></g></svg>