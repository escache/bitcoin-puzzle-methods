<svg xmlns="http://www.w3.org/2000/svg" width="480" height="235" viewBox="0 0 480 235"><title>M017 — 32-byte padding and dual-format P2PKH checks</title><desc>A scalar is encoded as exactly 32 big-endian bytes, multiplied by G, serialized and hashed. P2PKH comparisons use the address&#x27;s decoded 20-byte hash. Source finding: Left-padded scalar inputs, compressed/uncompressed public keys and known scalar-one address vectors guard verifier correctness.</desc><rect width="480" height="235" fill="white"/><g stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="75" width="58" height="42" fill="#ededed" stroke="#151515" stroke-width="1.8"/><path d="M100,96 L172,96" fill="none" stroke="#151515" stroke-width="1.8"/><path d="M172,96 L234,54" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M234,54 L230.796,60.2238" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M234,54 L227.032,54.6669" fill="none" stroke="#151515" stroke-width="1.3"/><rect x="245" y="38" width="82" height="32" fill="white" stroke="#151515" stroke-width="1.3"/><path d="M335,54 L392,54" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M392,54 L385.857,57.356" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M392,54 L385.857,50.644" fill="none" stroke="#151515" stroke-width="1.3"/><circle cx="412" cy="54" r="13" fill="white" stroke="#151515" stroke-width="1.5"/><path d="M172,96 L234,137" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M234,137 L227.025,136.411" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M234,137 L230.727,130.812" fill="none" stroke="#151515" stroke-width="1.3"/><rect x="245" y="121" width="82" height="32" fill="white" stroke="#151515" stroke-width="1.3"/><path d="M335,137 L392,137" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M392,137 L385.857,140.356" fill="none" stroke="#151515" stroke-width="1.3"/><path d="M392,137 L385.857,133.644" fill="none" stroke="#151515" stroke-width="1.3"/><circle cx="412" cy="137" r="13" fill="white" stroke="#151515" stroke-width="1.5"/><text x="286" y="58" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">A</text><text x="286" y="141" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#151515" text-anchor="middle" font-weight="normal">B</text><path d="M25,180 L455,180" fill="none" stroke="#c5c5c5" stroke-width="0.65"/><text x="80" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">32-byte scalar</text><text x="240" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">public-key encodings</text><text x="400" y="201" font-family="DejaVu Sans, sans-serif" font-size="11.8" fill="#151515" text-anchor="middle" font-weight="normal">20-byte hash</text></g></svg>