<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370"><title>M036 — Bounded ECDLP certificates and slot gates / mechanism plate</title><desc>Attach a machine-readable statement of bounds, target, provenance and job identity so a result can be checked against its declared task. Finding: Certifies declared bounds and evidence metadata; a certificate is not proof that the target lies in a guessed slot.</desc><rect width="960" height="370" fill="#f9faf7"/><path d="M24 30 H596" stroke="#c0cec3" stroke-width="1"/><text x="25" y="22" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#657a72">OPERATIONAL MECHANISM</text><g transform="translate(17 36) scale(1.2)"><g stroke-linecap="round" stroke-linejoin="round"><rect x="45" y="34" width="111" height="116" fill="#f9faf7" stroke="#123833" stroke-width="1.5"/><path d="M62,54 L136,54" fill="none" stroke="#657a72" stroke-width="0.8"/><path d="M62,72 L136,72" fill="none" stroke="#657a72" stroke-width="0.8"/><path d="M62,90 L136,90" fill="none" stroke="#657a72" stroke-width="0.8"/><path d="M62,108 L136,108" fill="none" stroke="#657a72" stroke-width="0.8"/><path d="M62,126 L136,126" fill="none" stroke="#657a72" stroke-width="0.8"/><path d="M166,92 L221,92" fill="none" stroke="#123833" stroke-width="1.8"/><path d="M221,92 L214.857,95.356" fill="none" stroke="#123833" stroke-width="1.8"/><path d="M221,92 L214.857,88.644" fill="none" stroke="#123833" stroke-width="1.8"/><path d="M255 56 L292 92 L255 128 L219 92 Z" fill="#e7eee8" stroke="#123833" stroke-width="1.6"/><path d="M300,92 L379,92" fill="none" stroke="#123833" stroke-width="2.4"/><path d="M379,92 L372.857,95.356" fill="none" stroke="#123833" stroke-width="2.4"/><path d="M379,92 L372.857,88.644" fill="none" stroke="#123833" stroke-width="2.4"/><circle cx="408" cy="92" r="15" fill="#f9faf7" stroke="#123833" stroke-width="1.8"/><text x="255" y="97" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#123833" tex