<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370"><title>M004 — Uniform within-shard representatives / mechanism plate</title><desc>Divide an interval into nonoverlapping shards and select one integer uniformly within each. This spreads a batch over the advertised range. Finding: Samples one integer per disjoint interval; representative checks do not exhaust their shard.</desc><rect width="960" height="370" fill="#f9faf7"/><path d="M24 30 H596" stroke="#c0cec3" stroke-width="1"/><text x="25" y="22" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#657a72">OPERATIONAL MECHANISM</text><g transform="translate(17 36) scale(1.2)"><g stroke-linecap="round" stroke-linejoin="round"><path d="M35,96 L445,96" fill="none" stroke="#123833" stroke-width="1.5"/><path d="M35,83 L35,109" fill="none" stroke="#123833" stroke-width="2"/><path d="M445,83 L445,109" fill="none" stroke="#123833" stroke-width="2"/><rect x="35" y="63" width="51.25" height="64" fill="#e7eee8" stroke="#657a72" stroke-width="0.8"/><circle cx="47" cy="95" r="4" fill="#123833" stroke="#123833" stroke-width="1"/><rect x="86.25" y="63" width="51.25" height="64" fill="#f9faf7" stroke="#657a72" stroke-width="0.8"/><circle cx="115.25" cy="95" r="4" fill="#123833" stroke="#123833" stroke-width="1"/><rect x="137.5" y="63" width="51.25" height="64" fill="#e7eee8" stroke="#657a72" stroke-width="0.8"/><circle cx="154.5" cy="95" r="4" fill="#123833" stroke="#123833" stroke-width="1"/><rect x="188.75" y="63" width="51.25" height="64" fill="#f9faf7" stroke="#657a72" stroke-width="0.8"/><circle cx="222.75" cy="95" r="4" fill="#123833" stroke="#123833" stroke-width="1"/><rect x="240" y="63" width="51.25" height="64" fill="#e7eee8" stroke="#657a72" stroke-width="0.8"/><circle cx="262" cy="95" r="4" fill="#123833" stroke="#123833" stroke-width="1"/><rect x="291.25" y="63" width="51.25" height="64" fill="#f9faf7" stroke="#657a72" stroke-width="0.8"/><circle cx="330.