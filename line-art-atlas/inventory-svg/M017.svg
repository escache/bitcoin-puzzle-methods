<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370"><title>M017 — 32-byte padding and dual-format P2PKH checks / mechanism plate</title><desc>A scalar is encoded as exactly 32 big-endian bytes, multiplied by G, serialized and hashed. P2PKH comparisons use the address&#x27;s decoded 20-byte hash. Finding: Left-padded scalar inputs, compressed/uncompressed public keys and known scalar-one address vectors guard verifier correctness.</desc><rect width="960" height="370" fill="#f9faf7"/><path d="M24 30 H596" stroke="#c0cec3" stroke-width="1"/><text x="25" y="22" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#657a72">OPERATIONAL MECHANISM</text><g transform="translate(17 36) scale(1.2)"><g stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="75" width="58" height="42" fill="#e7eee8" stroke="#123833" stroke-width="1.8"/><path d="M100,96 L172,96" fill="none" stroke="#123833" stroke-width="1.8"/><path d="M172,96 L234,54" fill="none" stroke="#123833" stroke-width="1.3"/><path d="M234,54 L230.796,60.2238" fill="none" stroke="#123833" stroke-width="1.3"/><path d="M234,54 L227.032,54.6669" fill="none" stroke="#123833" stroke-width="1.3"/><rect x="245" y="38" width="82" height="32" fill="#f9faf7" stroke="#123833" stroke-width="1.3"/><path d="M335,54 L392,54" fill="none" stroke="#123833" stroke-width="1.3"/><path d="M392,54 L385.857,57.356" fill="none" stroke="#123833" stroke-width="1.3"/><path d="M392,54 L385.857,50.644" fill="none" stroke="#123833" stroke-width="1.3"/><circle cx="412" cy="54" r="13" fill="#f9faf7" stroke="#123833" stroke-width="1.5"/><path d="M172,96 L234,137" fill="none" stroke="#123833" stroke-width="1.3"/><path d="M234,137 L227.025,136.411" fill="none" stroke="#123833" stroke-width="1.3"/><path d="M234,137 L230.727,130.812" fill="none" stroke="#123833" stroke-width="1.3"/><rect x="245" y="121" width="82" height="32" fill="#f9faf7" stroke="#123833" stroke-width="1.3"/><path d="M335,13