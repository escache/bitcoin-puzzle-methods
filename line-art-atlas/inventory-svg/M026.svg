<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370"><title>M026 — Direct D1 interval kangaroo / mechanism plate</title><desc>If k=base+D1, then Q-base*G=D1*G. A known base converts recovery into a smaller interval discrete log. Finding: Subtract a hypothesized scalar base and search the D1 leaf; useful only if the hypothesized coordinates are correct.</desc><rect width="960" height="370" fill="#f9faf7"/><path d="M24 30 H596" stroke="#c0cec3" stroke-width="1"/><text x="25" y="22" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#657a72">OPERATIONAL MECHANISM</text><g transform="translate(17 36) scale(1.2)"><g stroke-linecap="round" stroke-linejoin="round"><circle cx="74" cy="92" r="30" fill="#f9faf7" stroke="#123833" stroke-width="1.7"/><text x="74" y="97" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#123833" text-anchor="middle" font-weight="normal">Q</text><path d="M113,92 L191,92" fill="none" stroke="#123833" stroke-width="1.8"/><path d="M191,92 L184.857,95.356" fill="none" stroke="#123833" stroke-width="1.8"/><path d="M191,92 L184.857,88.644" fill="none" stroke="#123833" stroke-width="1.8"/><circle cx="238" cy="92" r="34" fill="#e7eee8" stroke="#123833" stroke-width="1.5"/><text x="238" y="87" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#123833" text-anchor="middle" font-weight="normal">subtract</text><text x="238" y="104" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#123833" text-anchor="middle" font-weight="normal">base x G</text><path d="M282,92 L359,92" fill="none" stroke="#123833" stroke-width="1.8"/><path d="M359,92 L352.857,95.356" fill="none" stroke="#123833" stroke-width="1.8"/><path d="M359,92 L352.857,88.644" fill="none" stroke="#123833" stroke-width="1.8"/><circle cx="404" cy="92" r="30" fill="#f9faf7" stroke="#123833" stroke-width="1.7"/><text x="404" y="97" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#123833" text-anchor="middle"