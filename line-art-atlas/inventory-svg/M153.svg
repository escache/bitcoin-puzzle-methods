<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370"><title>M153 — ECDSA nonce-reuse recovery / mechanism plate</title><desc>Reusing the same nonce for different messages creates two equations with the same unknown nonce, allowing elimination and scalar recovery. Finding: Algebraic recovery works in planted examples; harvested real signatures showed no matching reuse groups in recorded samples.</desc><rect width="960" height="370" fill="#f9faf7"/><path d="M24 30 H596" stroke="#c0cec3" stroke-width="1"/><text x="25" y="22" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#657a72">OPERATIONAL MECHANISM</text><g transform="translate(17 36) scale(1.2)"><g stroke-linecap="round" stroke-linejoin="round"><rect x="47" y="28" width="92" height="34" fill="#f9faf7" stroke="#123833" stroke-width="1.2"/><text x="93" y="49" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#123833" text-anchor="middle" font-weight="normal">signature</text><rect x="47" y="105" width="92" height="34" fill="#f9faf7" stroke="#123833" stroke-width="1.2"/><text x="93" y="126" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#123833" text-anchor="middle" font-weight="normal">signature</text><circle cx="240" cy="83" r="21" fill="#e7eee8" stroke="#123833" stroke-width="1.7"/><text x="240" y="87" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#123833" text-anchor="middle" font-weight="normal">nonce</text><path d="M145,45 L219,76" fill="none" stroke="#123833" stroke-width="1.3"/><path d="M145,122 L219,91" fill="none" stroke="#123833" stroke-width="1.3"/><path d="M269,83 L349,83" fill="none" stroke="#123833" stroke-width="2.2"/><path d="M349,83 L342.857,86.356" fill="none" stroke="#123833" stroke-width="2.2"/><path d="M349,83 L342.857,79.644" fill="none" stroke="#123833" stroke-width="2.2"/><rect x="364" y="63" width="55" height="40" fill="#f9faf7" stroke="#123833" stroke-width="1.2"/><text x="240" y="39" font-famil