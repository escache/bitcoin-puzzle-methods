<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370"><title>M038 — Cubic scalar decomposition / mechanism plate</title><desc>Set R1=floor(cuberoot(k)), divide k-R1^3 by R1^2, and retain quotient C1 and remainder D1. This exactly re-encodes k. Finding: Exact reconstruction of known integers works; the representation itself supplies no unknown digits or entropy reduction.</desc><rect width="960" height="370" fill="#f9faf7"/><path d="M24 30 H596" stroke="#c0cec3" stroke-width="1"/><text x="25" y="22" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#657a72">OPERATIONAL MECHANISM</text><g transform="translate(17 36) scale(1.2)"><g stroke-linecap="round" stroke-linejoin="round"><path d="M190 57 l26 -18 h88 l-26 18 Z" fill="#e7eee8" stroke="#123833" stroke-width="1.2"/><rect x="190" y="57" width="88" height="88" fill="#e7eee8" stroke="#123833" stroke-width="1.5"/><path d="M278 57 l26 -18 v88 l-26 18" fill="none" stroke="#123833" stroke-width="1.2"/><path d="M212,57 L212,145" fill="none" stroke="#c0cec3" stroke-width="0.5"/><path d="M190,79 L278,79" fill="none" stroke="#c0cec3" stroke-width="0.5"/><path d="M234,57 L234,145" fill="none" stroke="#c0cec3" stroke-width="0.5"/><path d="M190,101 L278,101" fill="none" stroke="#c0cec3" stroke-width="0.5"/><path d="M256,57 L256,145" fill="none" stroke="#c0cec3" stroke-width="0.5"/><path d="M190,123 L278,123" fill="none" stroke="#c0cec3" stroke-width="0.5"/><rect x="289" y="59" width="34" height="86" fill="#f9faf7" stroke="#123833" stroke-width="1"/><circle cx="338" cy="116" r="1.4" fill="#123833" stroke="#123833" stroke-width="0"/><circle cx="338" cy="125" r="1.4" fill="#123833" stroke="#123833" stroke-width="0"/><circle cx="338" cy="134" r="1.4" fill="#123833" stroke="#123833" stroke-width="0"/><circle cx="338" cy="143" r="1.4" fill="#123833" stroke="#123833" stroke-width="0"/><circle cx="347" cy="116" r="1.4" fill="#123833" stroke="#123833" stroke-width="0"/><circle c