<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370"><title>M018 — Synthetic fixtures versus disclosed puzzle data / mechanism plate</title><desc>A synthetic fixture can validate pipeline logic because its generation rule is known. It must remain separate from actual published puzzle secrets. Finding: PEC37 stores synthetic 1-160 chains separately and compares them with actual disclosed keys. Synthetic keys are not puzzle recoveries.</desc><rect width="960" height="370" fill="#f9faf7"/><path d="M24 30 H596" stroke="#c0cec3" stroke-width="1"/><text x="25" y="22" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#657a72">OPERATIONAL MECHANISM</text><g transform="translate(17 36) scale(1.2)"><g stroke-linecap="round" stroke-linejoin="round"><path d="M45,55 L433,55" fill="none" stroke="#c0cec3" stroke-width="0.8"/><circle cx="53" cy="55" r="3.5" fill="#123833" stroke="#123833" stroke-width="0"/><circle cx="92" cy="55" r="3.5" fill="#123833" stroke="#123833" stroke-width="0"/><circle cx="131" cy="55" r="3.5" fill="#123833" stroke="#123833" stroke-width="0"/><circle cx="170" cy="55" r="3.5" fill="#123833" stroke="#123833" stroke-width="0"/><circle cx="209" cy="55" r="3.5" fill="#123833" stroke="#123833" stroke-width="0"/><circle cx="248" cy="55" r="3.5" fill="#123833" stroke="#123833" stroke-width="0"/><circle cx="287" cy="55" r="3.5" fill="#123833" stroke="#123833" stroke-width="0"/><circle cx="326" cy="55" r="3.5" fill="#123833" stroke="#123833" stroke-width="0"/><circle cx="365" cy="55" r="3.5" fill="#123833" stroke="#123833" stroke-width="0"/><circle cx="404" cy="55" r="3.5" fill="#123833" stroke="#123833" stroke-width="0"/><path d="M45,123 L433,123" fill="none" stroke="#c0cec3" stroke-width="0.8"/><circle cx="53" cy="123" r="3.5" fill="#657a72" stroke="#123833" stroke-width="0"/><circle cx="92" cy="123" r="3.5" fill="#657a72" stroke="#123833" stroke-width="0"/><circle cx="131" cy="123" r="3.5" fill="#657a7